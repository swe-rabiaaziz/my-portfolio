      <g transform="translate(280,0)" filter="url(#pillShadow)"><rect width="60" height="32" rx="16" fill="url(#pillBg)" stroke="#334155" stroke-width="0.5"/><text x="30" y="21" text-anchor="middle" font-family="'Inter',sans-serif" font-weight="600" font-size="11" fill="#e2e8f0">iOS</text></g>
