<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="shimmerL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="-0.3" stop-color="#475569"><animate attributeName="offset" values="-0.3;1.3" dur="4s" repeatCount="indefinite"/></stop>
      <stop offset="-0.2" stop-color="#e2e8f0"><animate attributeName="offset" values="-0.2;1.4" dur="4s" repeatCount="indefinite"/></stop>
      <stop offset="-0.1" stop-color="#475569"><animate attributeName="offset" values="-0.1;1.5" dur="4s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="shimmerR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="-0.3" stop-color="#475569"><animate attributeName="offset" values="-0.3;1.3" dur="4s" repeatCount="indefinite"/></stop>
      <stop offset="-0.2" stop-color="#e2e8f0"><animate attributeName="offset" values="-0.2;1.4" dur="4s" repeatCount="indefinite"/></stop>
      <stop offset="-0.1" stop-color="#475569"><animate attributeName="offset" values="-0.1;1.5" dur="4s" repeatCount="indefinite"/></stop>
