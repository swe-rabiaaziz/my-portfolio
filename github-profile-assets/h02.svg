  <text x="470" y="36" font-family="'JetBrains Mono', monospace" font-size="12" fill="#334155" letter-spacing="3" font-weight="300">02</text>
  <text x="730" y="36" font-family="'SF Pro Display', Inter, system-ui, sans-serif" font-size="14" fill="#94a3b8" letter-spacing="6" font-weight="800">WHAT I BUILD</text>
  <circle cx="50" cy="30" r="2" fill="#1e293b"/>
