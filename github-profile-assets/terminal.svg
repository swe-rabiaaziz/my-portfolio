<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" role="img" aria-label="Apple iOS Terminal &amp; About Me Developer Profile for Rabia Aziz">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.6" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <radialGradient id="dotFadeG" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="dotFade"><rect width="1200" height="480" fill="url(#dotFadeG)"/></mask>

    <!-- Filters -->
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="glowBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="winShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#000" flood-opacity="0.85"/>
    </filter>

    <!-- Window & Glass Gradients -->
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121214"/>
      <stop offset="1" stop-color="#070709"/>
    </linearGradient>
    <linearGradient id="titleBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1f"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19191d"/>
      <stop offset="0.5" stop-color="#111114"/>
      <stop offset="1" stop-color="#09090c"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#52525b"/>
    </linearGradient>

    <clipPath id="winClip"><rect x="0" y="0" width="1020" height="428" rx="18"/></clipPath>
    <clipPath id="previewClip"><rect x="0" y="0" width="292" height="352" rx="14"/></clipPath>
  </defs>

  <style>
    /* Continuous smooth loop animations */
    @keyframes termTypeLoop {
      0% { opacity: 0; transform: translateY(4px); }
      10%, 90% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(4px); }
    }
    @keyframes curBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes avatarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes sweepGlint {
      0% { transform: translateX(-300px) skewX(-20deg); }
      35%, 100% { transform: translateX(1400px) skewX(-20deg); }
    }
    @keyframes borderPulse {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes liveDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    @keyframes liveRing {
      0% { r: 3.5px; stroke-opacity: 0.9; }
      100% { r: 12px; stroke-opacity: 0; }
    }
    @keyframes cardFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .term-text { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .mono-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ui-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect width="1200" height="480" fill="url(#dots)" mask="url(#dotFade)"/>

  <!-- Ambient Glows -->
  <g filter="url(#blur)">
    <circle cx="280" cy="200" r="140" fill="#ffffff" fill-opacity="0.08">
      <animate attributeName="cx" values="260;480;260" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="940" cy="360" r="130" fill="#737373" fill-opacity="0.08">
      <animate attributeName="cx" values="960;800;960" dur="16s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================= APPLE iOS / macOS TERMINAL WINDOW ================= -->
  <g transform="translate(90 26)">
    <!-- Window Frame Shadow -->
    <rect width="1020" height="428" rx="18" fill="url(#win)" filter="url(#winShadow)"/>

    <g clip-path="url(#winClip)">
      <rect width="1020" height="428" fill="url(#win)"/>

      <!-- Window Title Bar -->
      <rect width="1020" height="44" fill="url(#titleBar)"/>
      <rect y="43" width="1020" height="1" fill="#ffffff" fill-opacity="0.08"/>

      <!-- ================= APPLE iOS / macOS WINDOW BUTTONS ================= -->
      <!-- Red (Close) -->
      <circle cx="26" cy="22" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.8"/>
      <circle cx="26" cy="22" r="2" fill="#7a1410" fill-opacity="0.4"/>

      <!-- Yellow (Minimize) -->
      <circle cx="46" cy="22" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.8"/>
      <circle cx="46" cy="22" r="2" fill="#8f5b02" fill-opacity="0.4"/>

      <!-- Green (Maximize) -->
      <circle cx="66" cy="22" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.8"/>
      <circle cx="66" cy="22" r="2" fill="#0d661b" fill-opacity="0.4"/>

      <!-- macOS Title Pill -->
      <g transform="translate(370 10)">
        <rect width="280" height="24" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
        <text class="term-text" x="140" y="16.5" text-anchor="middle" font-size="11" letter-spacing="0.5" fill="#a3a3a3">rabia@portfolio — zsh — about-me</text>
      </g>

      <!-- Engine Live Dot -->
      <g transform="translate(974 22)">
        <circle cx="0" cy="0" r="3.5" fill="#fafafa" style="animation: liveDot 2s ease-in-out infinite;"/>
        <circle cx="0" cy="0" r="3.5" fill="none" stroke="#ffffff" style="animation: liveRing 2s ease-out infinite;"/>
      </g>
      <text class="mono-sub" x="960" y="25" text-anchor="end" font-size="9" font-weight="600" letter-spacing="1" fill="#737373">LIVE BIO</text>

      <!-- Glass Sheen -->
      <rect y="44" width="1020" height="384" fill="url(#sheen)"/>

      <!-- Light Sweep Across Terminal -->
      <rect x="-300" y="44" width="160" height="384" fill="#ffffff" fill-opacity="0.02" style="animation: sweepGlint 10s ease-in-out infinite;"/>

      <!-- ================= LEFT PANE: ABOUT RABIA AZIZ SHELL ================= -->
      <g transform="translate(34 76)" class="term-text" xml:space="preserve">

        <!-- Command 1: cat about-rabia.json -->
        <g>
          <text y="0" font-size="12.5">
            <tspan fill="#a3a3a3">rabia</tspan><tspan fill="#525252">@</tspan><tspan fill="#e5e5e5">flutter</tspan><tspan fill="#737373"> ~ % </tspan>
            <tspan fill="#fafafa" font-weight="600">cat about-rabia.json</tspan>
          </text>

          <!-- JSON Identity Card -->
          <g transform="translate(0 10)">
            <rect x="-10" y="0" width="630" height="152" rx="10" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.1"/>
            <rect x="-10" y="8" width="3" height="136" rx="1.5" fill="#fafafa" fill-opacity="0.7"/>

            <text y="18" font-size="11.5"><tspan fill="#a3a3a3">{</tspan></text>
            <text y="36" font-size="11.5"><tspan fill="#737373">  "name": </tspan><tspan fill="#ffffff" font-weight="600">"Rabia Aziz"</tspan><tspan fill="#737373">,</tspan></text>
            <text y="54" font-size="11.5"><tspan fill="#737373">  "role": </tspan><tspan fill="#e5e5e5">"Flutter Developer &amp; AI Mobile Specialist"</tspan><tspan fill="#737373">,</tspan></text>
            <text y="72" font-size="11.5"><tspan fill="#737373">  "experience": </tspan><tspan fill="#e5e5e5">"4+ Production Apps Shipped to Google Play"</tspan><tspan fill="#737373">,</tspan></text>
            <text y="90" font-size="11.5"><tspan fill="#737373">  "core_stack": </tspan><tspan fill="#d4d4d4">["Flutter", "Dart", "BLoC", "Drift", "Supabase"]</tspan><tspan fill="#737373">,</tspan></text>
            <text y="108" font-size="11.5"><tspan fill="#737373">  "ai_systems": </tspan><tspan fill="#d4d4d4">["Groq LLM", "Voice STT/TTS", "Gemini", "ML Kit"]</tspan><tspan fill="#737373">,</tspan></text>
            <text y="126" font-size="11.5"><tspan fill="#737373">  "location": </tspan><tspan fill="#e5e5e5">"Pakistan (UTC+5) · Available Worldwide"</tspan></text>
            <text y="144" font-size="11.5"><tspan fill="#a3a3a3">}</tspan></text>
          </g>
        </g>

        <!-- Command 2: echo $PHILOSOPHY -->
        <g transform="translate(0 216)">
          <text y="0" font-size="12.5">
            <tspan fill="#a3a3a3">rabia</tspan><tspan fill="#525252">@</tspan><tspan fill="#e5e5e5">flutter</tspan><tspan fill="#737373"> ~ % </tspan>
            <tspan fill="#fafafa" font-weight="600">echo $ENGINEERING_PHILOSOPHY</tspan>
          </text>
          <text y="18" font-size="11.5" fill="#a3a3a3">"Code is craft. Every pixel, animation, and state transition micro-optimized for 120 FPS."</text>
        </g>

        <!-- Command 3: contact -->
        <g transform="translate(0 258)">
          <text y="0" font-size="12.5">
            <tspan fill="#a3a3a3">rabia</tspan><tspan fill="#525252">@</tspan><tspan fill="#e5e5e5">flutter</tspan><tspan fill="#737373"> ~ % </tspan>
            <tspan fill="#fafafa" font-weight="600">open whatsapp://923275676026</tspan>
          </text>
          <text y="18" font-size="11.5" fill="#71717a">→ Direct communication channel active · Replies within 24 hours</text>
        </g>

        <!-- Active Command Prompt with Blinking Cursor -->
        <g transform="translate(0 300)">
          <text y="0" font-size="12.5">
            <tspan fill="#a3a3a3">rabia</tspan><tspan fill="#525252">@</tspan><tspan fill="#e5e5e5">flutter</tspan><tspan fill="#737373"> ~ % </tspan>
            <tspan fill="#d4d4d4">status --open-to-work</tspan>
          </text>
          <!-- Terminal Blinking Cursor -->
          <rect x="238" y="-12" width="8" height="15" fill="#fafafa" style="animation: curBlink 1s infinite;"/>
        </g>
      </g>

      <!-- ================= RIGHT PANE: RABIA AZIZ ABOUT-ME PREVIEW CARD ================= -->
      <g transform="translate(694 56)" style="animation: cardFloat 5s ease-in-out infinite;">
        <!-- Card Container Frame -->
        <rect width="292" height="352" rx="16" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1.2"/>
        
        <g clip-path="url(#previewClip)">
          <!-- Glass Reflection -->
          <path d="M0 0 L292 0 L292 110 L0 170 Z" fill="#ffffff" fill-opacity="0.03"/>

          <!-- Top Header -->
          <g transform="translate(18 16)">
            <text class="mono-sub" x="0" y="10" font-size="9" font-weight="700" letter-spacing="1.5" fill="#71717a">DEVELOPER PASSPORT</text>
            <g transform="translate(254 6)">
              <circle cx="0" cy="0" r="3.5" fill="#22c55e"/>
              <circle cx="0" cy="0" r="3.5" fill="none" stroke="#22c55e" style="animation: liveRing 2s ease-out infinite;"/>
            </g>
          </g>

          <line x1="18" y1="34" x2="274" y2="34" stroke="#27272a" stroke-width="1"/>

          <!-- Profile Badge: Avatar Emblem & Name -->
          <g transform="translate(18 46)">
            <!-- Stylized Monogram Avatar -->
            <g transform="translate(28 28)">
              <!-- Rotating Ring Halo -->
              <circle cx="0" cy="0" r="28" fill="none" stroke="#27272a" stroke-width="2"/>
              <circle cx="0" cy="0" r="28" fill="none" stroke="#fafafa" stroke-width="2.5" stroke-dasharray="140 40" stroke-linecap="round" style="transform-origin: 0 0; animation: avatarSpin 12s linear infinite;"/>
              <circle cx="0" cy="0" r="22" fill="#141418" stroke="#3f3f46" stroke-width="1"/>
              <text class="ui-font" x="0" y="6" text-anchor="middle" font-size="14" font-weight="900" fill="url(#avatarGrad)" letter-spacing="1">RA</text>
            </g>

            <!-- Name & Title -->
            <text class="ui-font" x="68" y="24" font-size="15" font-weight="800" fill="#fafafa">Rabia Aziz</text>
            <text class="ui-font" x="68" y="38" font-size="10.5" font-weight="500" fill="#a1a1aa">Flutter &amp; AI Mobile Dev</text>
            <text class="mono-sub" x="68" y="50" font-size="8.5" fill="#71717a">Swat, PK · UTC+5</text>
          </g>

          <line x1="18" y1="112" x2="274" y2="112" stroke="#27272a" stroke-width="1"/>

          <!-- Highlights Chips Grid -->
          <g transform="translate(18 122)">
            <!-- Pill 1: Shipped Apps -->
            <g transform="translate(0 0)">
              <rect width="256" height="30" rx="8" fill="#141418" stroke="#27272a" stroke-width="0.8"/>
              <text class="ui-font" x="12" y="19" font-size="10.5" fill="#fafafa">📱 <tspan font-weight="700">4+ Production Apps</tspan> on Google Play</text>
            </g>

            <!-- Pill 2: 120 FPS Target -->
            <g transform="translate(0 38)">
              <rect width="256" height="30" rx="8" fill="#141418" stroke="#27272a" stroke-width="0.8"/>
              <text class="ui-font" x="12" y="19" font-size="10.5" fill="#fafafa">⚡ <tspan font-weight="700">120 FPS Standard</tspan> · Zero-Jank Impeller</text>
            </g>

            <!-- Pill 3: AI Voice & Intelligence -->
            <g transform="translate(0 76)">
              <rect width="256" height="30" rx="8" fill="#141418" stroke="#27272a" stroke-width="0.8"/>
              <text class="ui-font" x="12" y="19" font-size="10.5" fill="#fafafa">🎙️ <tspan font-weight="700">AI Voice &amp; STT/TTS</tspan> Speech Agents</text>
            </g>

            <!-- Pill 4: Clean Architecture -->
            <g transform="translate(0 114)">
              <rect width="256" height="30" rx="8" fill="#141418" stroke="#27272a" stroke-width="0.8"/>
              <text class="ui-font" x="12" y="19" font-size="10.5" fill="#fafafa">🏛️ <tspan font-weight="700">Clean Architecture</tspan> · BLoC &amp; Drift ORM</text>
            </g>
          </g>

          <!-- Status Footer Pill -->
          <g transform="translate(18 282)">
            <rect width="256" height="54" rx="10" fill="#0f0f13" stroke="#27272a" stroke-width="1"/>
            <circle cx="16" cy="20" r="4" fill="#22c55e"/>
            <text class="ui-font" x="26" y="24" font-size="10.5" font-weight="700" fill="#fafafa">Open to Work Worldwide</text>
            <text class="mono-sub" x="16" y="42" font-size="8.5" fill="#71717a">Full-Time Remote Roles &amp; Mobile Builds</text>
          </g>
        </g>

        <!-- Card Glow Border -->
        <rect width="292" height="352" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
      </g>

      <!-- Window Top Edge Highlight -->
      <rect x="250" y="0" width="520" height="1.5" fill="url(#edge)"/>
    </g>

    <!-- Traveling Highlight Border (Infinite Pulse) -->
    <rect x="0.5" y="0.5" width="1019" height="427" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    <rect x="0.5" y="0.5" width="1019" height="427" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.5" pathLength="1000" stroke-dasharray="80 920" stroke-linecap="round" style="animation: borderPulse 9s linear infinite;"/>
    <rect x="0.5" y="0.5" width="1019" height="427" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="4" pathLength="1000" stroke-dasharray="80 920" stroke-linecap="round" filter="url(#glowBlur)" style="animation: borderPulse 9s linear infinite;"/>
  </g>
</svg>
