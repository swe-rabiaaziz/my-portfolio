<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" role="img" aria-label="Apple iOS Terminal &amp; Live Flutter Widget Preview for Rabia Aziz">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.6" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <radialGradient id="dotFadeG" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="dotFade"><rect width="1200" height="480" fill="url(#dotFadeG)"/></mask>

    <!-- Filters -->
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="glowBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="winShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#000" flood-opacity="0.85"/>
    </filter>

    <!-- Window & Glass Gradients -->
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121214"/>
      <stop offset="1" stop-color="#070709"/>
    </linearGradient>
    <linearGradient id="titleBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1f"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="previewBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18181b"/>
      <stop offset="0.6" stop-color="#101012"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flutterGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a3a3a3"/>
    </linearGradient>

    <clipPath id="winClip"><rect x="0" y="0" width="1020" height="428" rx="18"/></clipPath>
    <clipPath id="previewClip"><rect x="0" y="0" width="292" height="352" rx="14"/></clipPath>
  </defs>

  <style>
    /* Continuous seamless looping animations */
    @keyframes termLoop {
      0%, 100% { opacity: 1; }
    }
    @keyframes curBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes eq1 { 0%, 100% { height: 6px; y: 22px; } 50% { height: 26px; y: 2px; } }
    @keyframes eq2 { 0%, 100% { height: 24px; y: 4px; } 50% { height: 10px; y: 18px; } }
    @keyframes eq3 { 0%, 100% { height: 14px; y: 14px; } 50% { height: 28px; y: 0px; } }
    @keyframes eq4 { 0%, 100% { height: 26px; y: 2px; } 50% { height: 8px; y: 20px; } }
    @keyframes eq5 { 0%, 100% { height: 10px; y: 18px; } 50% { height: 22px; y: 6px; } }
    
    @keyframes sweepGlint {
      0% { transform: translateX(-300px) skewX(-20deg); }
      35%, 100% { transform: translateX(1400px) skewX(-20deg); }
    }
    @keyframes borderPulse {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes liveDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    @keyframes liveRing {
      0% { r: 3.5px; stroke-opacity: 0.9; }
      100% { r: 11px; stroke-opacity: 0; }
    }

    .term-text { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .mono-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ui-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect width="1200" height="480" fill="url(#dots)" mask="url(#dotFade)"/>

  <!-- Ambient Glows -->
  <g filter="url(#blur)">
    <circle cx="280" cy="200" r="140" fill="#ffffff" fill-opacity="0.08">
      <animate attributeName="cx" values="260;480;260" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="940" cy="360" r="130" fill="#737373" fill-opacity="0.08">
      <animate attributeName="cx" values="960;800;960" dur="16s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================= APPLE iOS / macOS TERMINAL WINDOW ================= -->
  <g transform="translate(90 26)">
    <!-- Main Window Frame & Shadow -->
    <rect width="1020" height="428" rx="18" fill="url(#win)" filter="url(#winShadow)"/>

    <g clip-path="url(#winClip)">
      <rect width="1020" height="428" fill="url(#win)"/>

      <!-- Window Title Bar -->
      <rect width="1020" height="44" fill="url(#titleBar)"/>
      <rect y="43" width="1020" height="1" fill="#ffffff" fill-opacity="0.08"/>

      <!-- ================= APPLE iOS / macOS WINDOW BUTTONS ================= -->
      <!-- Red (Close) -->
      <circle cx="26" cy="22" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.8"/>
      <circle cx="26" cy="22" r="2" fill="#7a1410" fill-opacity="0.4"/>

      <!-- Yellow (Minimize) -->
      <circle cx="46" cy="22" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.8"/>
      <circle cx="46" cy="22" r="2" fill="#8f5b02" fill-opacity="0.4"/>

      <!-- Green (Maximize) -->
      <circle cx="66" cy="22" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.8"/>
      <circle cx="66" cy="22" r="2" fill="#0d661b" fill-opacity="0.4"/>

      <!-- Centered macOS Title Pill -->
      <g transform="translate(390 10)">
        <rect width="240" height="24" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
        <text class="term-text" x="120" y="16.5" text-anchor="middle" font-size="11" letter-spacing="0.5" fill="#a3a3a3">rabia@dev — zsh — 120 FPS</text>
      </g>

      <!-- Live Impeller Engine Status -->
      <g transform="translate(974 22)">
        <circle cx="0" cy="0" r="3.5" fill="#fafafa" style="animation: liveDot 2s ease-in-out infinite;"/>
        <circle cx="0" cy="0" r="3.5" fill="none" stroke="#ffffff" style="animation: liveRing 2s ease-out infinite;"/>
      </g>
      <text class="mono-sub" x="960" y="25" text-anchor="end" font-size="9" font-weight="600" letter-spacing="1" fill="#737373">IMPELLER</text>

      <!-- Glass Sheen -->
      <rect y="44" width="1020" height="384" fill="url(#sheen)"/>

      <!-- Moving Light Sweep Across Terminal -->
      <rect x="-300" y="44" width="160" height="384" fill="#ffffff" fill-opacity="0.02" style="animation: sweepGlint 10s ease-in-out infinite;"/>

      <!-- ================= LEFT PANE: CODE & SHELL EXECUTION ================= -->
      <g transform="translate(34 76)" class="term-text" xml:space="preserve">

        <!-- Line 1: whoami -->
        <g>
          <text y="0" font-size="12.5">
            <tspan fill="#a3a3a3">rabia</tspan><tspan fill="#525252">@</tspan><tspan fill="#e5e5e5">flutter</tspan><tspan fill="#737373"> ~ % </tspan>
            <tspan fill="#fafafa" font-weight="600">whoami</tspan>
          </text>
          <text y="19" font-size="11.5" fill="#a3a3a3">Flutter App Developer · AI Mobile Specialist · Cross-Platform Engineer</text>
        </g>

        <!-- Line 2: cat skills.dart -->
        <g transform="translate(0 42)">
          <text y="0" font-size="12.5">
            <tspan fill="#a3a3a3">rabia</tspan><tspan fill="#525252">@</tspan><tspan fill="#e5e5e5">flutter</tspan><tspan fill="#737373"> ~ % </tspan>
            <tspan fill="#fafafa" font-weight="600">cat skills.dart</tspan>
          </text>

          <!-- Dart Code Card -->
          <g transform="translate(0 10)">
            <rect x="-10" y="0" width="630" height="136" rx="10" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.1"/>
            <rect x="-10" y="8" width="3" height="120" rx="1.5" fill="#fafafa" fill-opacity="0.6"/>

            <text y="18" font-size="11.5"><tspan fill="#737373">class </tspan><tspan fill="#fafafa" font-weight="600">RabiaAziz </tspan><tspan fill="#737373">extends </tspan><tspan fill="#e5e5e5">MobileEngineer {</tspan></text>
            <text y="37" font-size="11.5"><tspan fill="#737373">  final </tspan><tspan fill="#d4d4d4">frameworks  = </tspan><tspan fill="#ffffff">['Flutter', 'Dart', 'Android', 'iOS']</tspan><tspan fill="#737373">;</tspan></text>
            <text y="56" font-size="11.5"><tspan fill="#737373">  final </tspan><tspan fill="#d4d4d4">backends    = </tspan><tspan fill="#ffffff">['Supabase', 'Firebase', 'PostgreSQL']</tspan><tspan fill="#737373">;</tspan></text>
            <text y="75" font-size="11.5"><tspan fill="#737373">  final </tspan><tspan fill="#d4d4d4">aiMatrix    = </tspan><tspan fill="#ffffff">['Groq LLM', 'Gemini', 'ML Kit', 'STT/TTS']</tspan><tspan fill="#737373">;</tspan></text>
            <text y="94" font-size="11.5"><tspan fill="#737373">  final </tspan><tspan fill="#d4d4d4">persistence = </tspan><tspan fill="#ffffff">['Drift ORM', 'SQLite', 'Hive']</tspan><tspan fill="#737373">;</tspan></text>
            <text y="113" font-size="11.5"><tspan fill="#737373">  final </tspan><tspan fill="#d4d4d4">architecture= </tspan><tspan fill="#ffffff">['Clean Architecture', 'BLoC', 'Provider']</tspan><tspan fill="#737373">;</tspan></text>
            <text y="130" font-size="11.5" fill="#fafafa">}</text>
          </g>
        </g>

        <!-- Line 3: echo $CURRENT_FOCUS -->
        <g transform="translate(0 206)">
          <text y="0" font-size="12.5">
            <tspan fill="#a3a3a3">rabia</tspan><tspan fill="#525252">@</tspan><tspan fill="#e5e5e5">flutter</tspan><tspan fill="#737373"> ~ % </tspan>
            <tspan fill="#fafafa" font-weight="600">echo $CURRENT_FOCUS</tspan>
          </text>
          <text y="18" font-size="11.5" fill="#a3a3a3">Building AI-powered experiences &amp; zero-jank Flutter apps across mobile, web &amp; desktop</text>
        </g>

        <!-- Line 4: open contact -->
        <g transform="translate(0 248)">
          <text y="0" font-size="12.5">
            <tspan fill="#a3a3a3">rabia</tspan><tspan fill="#525252">@</tspan><tspan fill="#e5e5e5">flutter</tspan><tspan fill="#737373"> ~ % </tspan>
            <tspan fill="#fafafa" font-weight="600">open swe.rabiaaziz@gmail.com</tspan>
          </text>
          <text y="18" font-size="11.5" fill="#737373">→ Available worldwide for full-time remote roles &amp; contracts</text>
        </g>

        <!-- Active Command Prompt with Blinking Cursor -->
        <g transform="translate(0 290)">
          <text y="0" font-size="12.5">
            <tspan fill="#a3a3a3">rabia</tspan><tspan fill="#525252">@</tspan><tspan fill="#e5e5e5">flutter</tspan><tspan fill="#737373"> ~ % </tspan>
            <tspan fill="#d4d4d4">flutter run --release --impeller</tspan>
          </text>
          <!-- Apple Terminal Blinking Cursor -->
          <rect x="368" y="-12" width="8" height="15" fill="#fafafa" style="animation: curBlink 1s infinite;"/>
        </g>
      </g>

      <!-- ================= RIGHT PANE: REAL FLUTTER WIDGET PREVIEW ================= -->
      <g transform="translate(694 56)">
        <!-- Phone / Card Frame -->
        <rect width="292" height="352" rx="16" fill="url(#previewBg)" stroke="#27272a" stroke-width="1.2"/>
        
        <g clip-path="url(#previewClip)">
          <!-- Glass Reflection -->
          <rect width="292" height="352" fill="none"/>
          <path d="M0 0 L292 0 L292 120 L0 180 Z" fill="#ffffff" fill-opacity="0.02"/>

          <!-- Phone Top Notch / Dynamic Island -->
          <rect x="96" y="8" width="100" height="16" rx="8" fill="#000000" stroke="#27272a" stroke-width="0.8"/>
          <circle cx="112" cy="16" r="3.5" fill="#18181b"/>
          <circle cx="178" cy="16" r="2.5" fill="#0d9488" fill-opacity="0.8"/>

          <!-- iOS Status Bar Elements -->
          <text class="term-text" x="22" y="20" font-size="10" font-weight="600" fill="#a3a3a3">9:41</text>
          <!-- Wifi & Battery Icons -->
          <g transform="translate(250 12)" fill="#a3a3a3">
            <rect x="0" y="2" width="18" height="9" rx="2.5" fill="none" stroke="#a3a3a3" stroke-width="1"/>
            <rect x="2" y="4" width="11" height="5" rx="1" fill="#fafafa"/>
            <rect x="19" y="5" width="1.5" height="3" rx="0.5" fill="#a3a3a3"/>
          </g>

          <!-- Flutter Preview Header -->
          <g transform="translate(18 36)">
            <!-- Flutter Logo Mark -->
            <path d="M12 2 L2 12 L5 15 L18 2 Z" fill="#fafafa"/>
            <path d="M7 17 L12 22 L18 22 L10 14 Z" fill="#a3a3a3"/>
            <text class="ui-font" x="26" y="16" font-size="12" font-weight="700" fill="#fafafa">Flutter Live Widget</text>
            <rect x="180" y="4" width="76" height="16" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
            <circle cx="190" cy="12" r="3" fill="#22c55e"/>
            <text class="mono-sub" x="226" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#fafafa">120 FPS</text>
          </g>

          <line x1="18" y1="62" x2="274" y2="62" stroke="#27272a" stroke-width="1"/>

          <!-- Rendered Component: CivicCoach AI Audio Card -->
          <g transform="translate(18 72)">
            <!-- Outer Card -->
            <rect width="256" height="204" rx="12" fill="#131316" stroke="#2e2e33" stroke-width="1"/>
            
            <!-- App Badge -->
            <rect x="12" y="12" width="28" height="28" rx="8" fill="#222226" stroke="#3f3f46" stroke-width="0.8"/>
            <text class="ui-font" x="26" y="30" text-anchor="middle" font-size="14">🏛️</text>

            <text class="ui-font" x="48" y="23" font-size="12" font-weight="700" fill="#fafafa">CivicCoach AI</text>
            <text class="ui-font" x="48" y="36" font-size="9.5" fill="#71717a">USCIS Oral Exam Simulator</text>

            <!-- Live AI Voice Visualizer Waveform -->
            <g transform="translate(12 50)">
              <rect width="232" height="64" rx="8" fill="#09090b" stroke="#27272a" stroke-width="0.8"/>
              
              <!-- Frequency Bars (Animating continuous speech frequencies) -->
              <g transform="translate(48 18)" fill="#fafafa">
                <rect x="0" y="10" width="4" height="16" rx="2" style="animation: eq1 0.8s ease-in-out infinite;"/>
                <rect x="8" y="4" width="4" height="24" rx="2" style="animation: eq2 0.9s ease-in-out infinite;"/>
                <rect x="16" y="14" width="4" height="14" rx="2" style="animation: eq3 0.75s ease-in-out infinite;"/>
                <rect x="24" y="2" width="4" height="26" rx="2" style="animation: eq4 0.85s ease-in-out infinite;"/>
                <rect x="32" y="8" width="4" height="20" rx="2" style="animation: eq1 0.7s ease-in-out infinite;"/>
                <rect x="40" y="16" width="4" height="12" rx="2" style="animation: eq5 0.95s ease-in-out infinite;"/>
                <rect x="48" y="0" width="4" height="28" rx="2" style="animation: eq3 0.8s ease-in-out infinite;"/>
                <rect x="56" y="10" width="4" height="18" rx="2" style="animation: eq2 0.9s ease-in-out infinite;"/>
                <rect x="64" y="4" width="4" height="24" rx="2" style="animation: eq4 0.7s ease-in-out infinite;"/>
                <rect x="72" y="14" width="4" height="14" rx="2" style="animation: eq1 0.85s ease-in-out infinite;"/>
                <rect x="80" y="2" width="4" height="26" rx="2" style="animation: eq3 0.8s ease-in-out infinite;"/>
                <rect x="88" y="8" width="4" height="20" rx="2" style="animation: eq5 0.75s ease-in-out infinite;"/>
                <rect x="96" y="16" width="4" height="12" rx="2" style="animation: eq2 0.9s ease-in-out infinite;"/>
                <rect x="104" y="6" width="4" height="22" rx="2" style="animation: eq4 0.8s ease-in-out infinite;"/>
                <rect x="112" y="12" width="4" height="16" rx="2" style="animation: eq1 0.7s ease-in-out infinite;"/>
                <rect x="120" y="4" width="4" height="24" rx="2" style="animation: eq3 0.85s ease-in-out infinite;"/>
                <rect x="128" y="16" width="4" height="12" rx="2" style="animation: eq5 0.9s ease-in-out infinite;"/>
              </g>

              <!-- Live Audio Feedback Label -->
              <text class="mono-sub" x="116" y="55" text-anchor="middle" font-size="8" letter-spacing="1" fill="#22c55e">● REAL-TIME STT STREAMING</text>
            </g>

            <!-- Tactile Flutter Button -->
            <g transform="translate(12 122)">
              <rect width="232" height="34" rx="17" fill="#fafafa"/>
              <text class="ui-font" x="116" y="21.5" text-anchor="middle" font-size="11" font-weight="700" fill="#0a0a0a">Simulate Officer Voice Test</text>
            </g>

            <!-- Architecture & Performance Tags -->
            <g transform="translate(12 166)">
              <rect width="112" height="24" rx="6" fill="#18181b" stroke="#27272a" stroke-width="0.8"/>
              <text class="mono-sub" x="56" y="15.5" text-anchor="middle" font-size="8.5" fill="#a1a1aa">BLoC State · Drift</text>

              <rect x="120" width="112" height="24" rx="6" fill="#18181b" stroke="#27272a" stroke-width="0.8"/>
              <text class="mono-sub" x="176" y="15.5" text-anchor="middle" font-size="8.5" fill="#a1a1aa">0 dropped frames</text>
            </g>
          </g>

          <!-- Footer Status -->
          <g transform="translate(18 290)">
            <rect width="256" height="36" rx="8" fill="#101014" stroke="#27272a" stroke-width="0.8"/>
            <text class="term-text" x="12" y="16" font-size="9" fill="#71717a">Sync Status: <tspan fill="#fafafa">Offline-First</tspan></text>
            <text class="term-text" x="12" y="28" font-size="9" fill="#71717a">Hot Reload: <tspan fill="#22c55e">42ms</tspan> · Zero Memory Leaks</text>
            <circle cx="242" cy="18" r="4" fill="#22c55e"/>
          </g>
        </g>

        <!-- Preview Card Glow Border -->
        <rect width="292" height="352" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
      </g>

      <!-- Window Top Edge Highlight -->
      <rect x="250" y="0" width="520" height="1.5" fill="url(#edge)"/>
    </g>

    <!-- Traveling Highlight Border (Infinite Pulse) -->
    <rect x="0.5" y="0.5" width="1019" height="427" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    <rect x="0.5" y="0.5" width="1019" height="427" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.5" pathLength="1000" stroke-dasharray="80 920" stroke-linecap="round" style="animation: borderPulse 9s linear infinite;"/>
    <rect x="0.5" y="0.5" width="1019" height="427" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="4" pathLength="1000" stroke-dasharray="80 920" stroke-linecap="round" filter="url(#glowBlur)" style="animation: borderPulse 9s linear infinite;"/>
  </g>
</svg>
