<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="240" role="img" aria-label="Rabia Aziz GitHub Command Center: Activity, 2-Day Streak &amp; Most Used Languages">
  <defs>
    <!-- Background & Plate Gradients -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141416"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="borderSweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f3f46"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#3f3f46"/>
    </linearGradient>

    <!-- Language Bar Gradients -->
    <linearGradient id="barDart" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d4d4d8"/>
    </linearGradient>
    <linearGradient id="barTs" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a1a1aa"/>
      <stop offset="1" stop-color="#71717a"/>
    </linearGradient>
    <linearGradient id="barHtml" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#71717a"/>
      <stop offset="1" stop-color="#52525b"/>
    </linearGradient>
    <linearGradient id="barCpp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#52525b"/>
      <stop offset="1" stop-color="#3f3f46"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <filter id="flameGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif; }
    
    @keyframes laser {
      0% { stroke-dashoffset: 1200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseFlame {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.12); opacity: 1; }
    }
    @keyframes flameRing {
      0% { r: 38px; stroke-opacity: 0.7; }
      100% { r: 52px; stroke-opacity: 0; }
    }
    @keyframes liveDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes rankPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    .laser-stroke {
      stroke-dasharray: 90 1110;
      animation: laser 8s linear infinite;
    }
  </style>

  <!-- ================= CARD 1: GITHUB ACTIVITY & RANK (LEFT, width 320) ================= -->
  <g transform="translate(6 6)">
    <rect width="316" height="228" rx="16" fill="url(#cardBg)" stroke="#27272a" stroke-width="1.2" filter="url(#cardShadow)"/>
    
    <!-- Header -->
    <g transform="translate(20 22)">
      <!-- GitHub Icon -->
      <path d="M9 1C4.58 1 1 4.58 1 9C1 12.54 3.29 15.53 6.47 16.59C6.87 16.66 7.01 16.42 7.01 16.21C7.01 16.02 7 15.52 7 14.84C4.78 15.32 4.31 13.77 4.31 13.77C3.95 12.84 3.43 12.6 3.43 12.6C2.7 12.11 3.48 12.12 3.48 12.12C4.29 12.18 4.71 12.95 4.71 12.95C5.42 14.17 6.58 13.82 7.03 13.61C7.1 13.1 7.31 12.74 7.53 12.54C5.76 12.34 3.9 11.65 3.9 8.61C3.9 7.74 4.21 7.03 4.72 6.48C4.64 6.28 4.36 5.47 4.8 4.37C4.8 4.37 5.47 4.16 6.99 5.19C7.62 5.01 8.3 4.93 9 4.93C9.7 4.93 10.38 5.01 11.01 5.19C12.53 4.16 13.2 4.37 13.2 4.37C13.64 5.47 13.36 6.28 13.28 6.48C13.79 7.03 14.1 7.74 14.1 8.61C14.1 11.66 12.23 12.33 10.46 12.53C10.75 12.78 11.01 13.28 11.01 14.03C11.01 15.12 11 16 11 16.21C11 16.42 11.14 16.67 11.55 16.59C14.72 15.53 17 12.54 17 9C17 4.58 13.42 1 9 1Z" fill="#fafafa"/>
      <text class="sans" x="24" y="14" font-size="13" font-weight="700" fill="#fafafa">GitHub Activity</text>
    </g>

    <!-- Metrics List -->
    <g transform="translate(20 54)">
      <!-- Metric 1: Total Contributions -->
      <g transform="translate(0 0)">
        <text class="sans" x="0" y="14" font-size="11.5" fill="#a1a1aa">Total Contributions</text>
        <text class="mono" x="180" y="14" font-size="13" font-weight="700" text-anchor="end" fill="#fafafa">81+</text>
      </g>
      <line x1="0" y1="22" x2="185" y2="22" stroke="#27272a" stroke-width="0.8"/>

      <!-- Metric 2: Repositories -->
      <g transform="translate(0 32)">
        <text class="sans" x="0" y="14" font-size="11.5" fill="#a1a1aa">Production Repos</text>
        <text class="mono" x="180" y="14" font-size="13" font-weight="700" text-anchor="end" fill="#fafafa">14</text>
      </g>
      <line x1="0" y1="54" x2="185" y2="54" stroke="#27272a" stroke-width="0.8"/>

      <!-- Metric 3: Target FPS -->
      <g transform="translate(0 64)">
        <text class="sans" x="0" y="14" font-size="11.5" fill="#a1a1aa">Impeller Pipeline</text>
        <text class="mono" x="180" y="14" font-size="13" font-weight="700" text-anchor="end" fill="#fafafa">120 FPS</text>
      </g>
      <line x1="0" y1="86" x2="185" y2="86" stroke="#27272a" stroke-width="0.8"/>

      <!-- Metric 4: Clean Architecture -->
      <g transform="translate(0 96)">
        <text class="sans" x="0" y="14" font-size="11.5" fill="#a1a1aa">Clean Architecture</text>
        <text class="mono" x="180" y="14" font-size="13" font-weight="700" text-anchor="end" fill="#fafafa">100%</text>
      </g>
    </g>

    <!-- Right Side: A+ Rank Badge -->
    <g transform="translate(248 108)">
      <circle cx="0" cy="0" r="38" fill="none" stroke="#27272a" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="38" fill="none" stroke="#fafafa" stroke-width="3" stroke-dasharray="190 50" stroke-linecap="round" transform="rotate(-45)"/>
      <circle cx="0" cy="0" r="30" fill="#18181b" stroke="#3f3f46" stroke-width="0.8"/>
      <text class="sans" x="0" y="8" text-anchor="middle" font-size="24" font-weight="900" fill="#ffffff" style="transform-box: fill-box; transform-origin: center; animation: rankPulse 2.8s ease-in-out infinite;">A+</text>
      <text class="mono" x="0" y="52" text-anchor="middle" font-size="7.5" font-weight="700" letter-spacing="1" fill="#71717a">CRAFT</text>
    </g>

    <!-- Bottom Status -->
    <g transform="translate(20 186)">
      <rect width="276" height="24" rx="6" fill="#18181b" stroke="#27272a" stroke-width="0.8"/>
      <text class="mono" x="138" y="15.5" text-anchor="middle" font-size="8.5" letter-spacing="0.8" fill="#a1a1aa">COMMITS · PRs · ZERO JANK</text>
    </g>

    <!-- Animated Border Laser -->
    <rect width="316" height="228" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.3" pathLength="1200" class="laser-stroke"/>
  </g>

  <!-- ================= CARD 2: STREAK ENGINE (CENTER, width 320) ================= -->
  <g transform="translate(342 6)">
    <rect width="316" height="228" rx="16" fill="url(#cardBg)" stroke="#27272a" stroke-width="1.2" filter="url(#cardShadow)"/>

    <!-- Header -->
    <g transform="translate(20 22)">
      <!-- Flame Icon -->
      <path d="M8.5 0C8.5 0 9.8 3.5 12 5.5C13.5 7 15 9.2 15 12C15 16 11.9 19 8 19C4.1 19 1 16 1 12C1 8.8 3.5 5.5 5 4C5 6.5 7 8 7 8C7 8 7.5 4 8.5 0Z" fill="#fafafa" style="transform-box: fill-box; transform-origin: center; animation: pulseFlame 2.2s ease-in-out infinite;"/>
      <text class="sans" x="22" y="14" font-size="13" font-weight="700" fill="#fafafa">Contribution Streak</text>
      <circle cx="282" cy="10" r="3" fill="#22c55e" style="animation: liveDot 1.8s infinite;"/>
    </g>

    <!-- Center Streak Dial -->
    <g transform="translate(158 100)">
      <!-- Outer Pulsing Radar Ring -->
      <circle cx="0" cy="0" r="40" fill="none" stroke="#ffffff" stroke-width="1.5" style="animation: flameRing 2.4s ease-out infinite;"/>
      
      <!-- Dial Background -->
      <circle cx="0" cy="0" r="42" fill="#121215" stroke="#27272a" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#fafafa" stroke-width="3" stroke-dasharray="190 80" stroke-linecap="round" transform="rotate(-90)"/>
      
      <!-- Big Streak Number -->
      <text class="sans" x="0" y="8" text-anchor="middle" font-size="34" font-weight="900" fill="#ffffff">2</text>
      <text class="mono" x="0" y="24" text-anchor="middle" font-size="8" font-weight="700" letter-spacing="1" fill="#a1a1aa">DAYS</text>
    </g>

    <!-- Streak Details (Left & Right) -->
    <g transform="translate(20 92)">
      <text class="sans" x="24" y="0" text-anchor="middle" font-size="11" fill="#71717a">Total</text>
      <text class="mono" x="24" y="16" text-anchor="middle" font-size="14" font-weight="700" fill="#fafafa">81</text>
      <text class="sans" x="24" y="28" text-anchor="middle" font-size="9" fill="#52525b">contributions</text>
    </g>

    <g transform="translate(252 92)">
      <text class="sans" x="24" y="0" text-anchor="middle" font-size="11" fill="#71717a">Longest</text>
      <text class="mono" x="24" y="16" text-anchor="middle" font-size="14" font-weight="700" fill="#fafafa">3</text>
      <text class="sans" x="24" y="28" text-anchor="middle" font-size="9" fill="#52525b">day streak</text>
    </g>

    <!-- Bottom Date Badge -->
    <g transform="translate(20 174)">
      <rect width="276" height="36" rx="8" fill="#101014" stroke="#27272a" stroke-width="0.8"/>
      <text class="mono" x="138" y="16" text-anchor="middle" font-size="9" fill="#fafafa">CURRENT STREAK: ACTIVE</text>
      <text class="mono" x="138" y="28" text-anchor="middle" font-size="8.5" fill="#71717a">Nov 13 – Nov 14 (Active)</text>
    </g>

    <!-- Animated Border Laser -->
    <rect width="316" height="228" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.3" pathLength="1200" class="laser-stroke" style="animation-delay: -2.6s;"/>
  </g>

  <!-- ================= CARD 3: TOP LANGUAGES (RIGHT, width 320) ================= -->
  <g transform="translate(678 6)">
    <rect width="316" height="228" rx="16" fill="url(#cardBg)" stroke="#27272a" stroke-width="1.2" filter="url(#cardShadow)"/>

    <!-- Header -->
    <g transform="translate(20 22)">
      <text class="mono" x="0" y="14" font-size="13" font-weight="700" fill="#fafafa">&lt;/&gt;</text>
      <text class="sans" x="22" y="14" font-size="13" font-weight="700" fill="#fafafa">Most Used Languages</text>
    </g>

    <!-- Progress Bar -->
    <g transform="translate(20 48)">
      <rect width="276" height="8" rx="4" fill="#27272a"/>
      <!-- Dart: 74.2% -> 205px -->
      <rect width="205" height="8" rx="4" fill="url(#barDart)"/>
      <!-- TS: 14.8% -> 41px -->
      <rect x="207" width="41" height="8" rx="2" fill="url(#barTs)"/>
      <!-- HTML: 6.5% -> 18px -->
      <rect x="250" width="18" height="8" rx="2" fill="url(#barHtml)"/>
      <!-- C++: 4.5% -> 6px -->
      <rect x="270" width="6" height="8" rx="2" fill="url(#barCpp)"/>
    </g>

    <!-- Languages Breakdown List -->
    <g transform="translate(20 74)">
      <!-- Dart -->
      <g transform="translate(0 0)">
        <circle cx="5" cy="5" r="4" fill="#ffffff"/>
        <text class="sans" x="16" y="9" font-size="11.5" font-weight="600" fill="#fafafa">Dart</text>
        <text class="mono" x="276" y="9" font-size="11" text-anchor="end" fill="#a1a1aa">74.2%</text>
      </g>

      <!-- TypeScript -->
      <g transform="translate(0 26)">
        <circle cx="5" cy="5" r="4" fill="#a1a1aa"/>
        <text class="sans" x="16" y="9" font-size="11.5" font-weight="600" fill="#fafafa">TypeScript / JS</text>
        <text class="mono" x="276" y="9" font-size="11" text-anchor="end" fill="#a1a1aa">14.8%</text>
      </g>

      <!-- HTML / CSS -->
      <g transform="translate(0 52)">
        <circle cx="5" cy="5" r="4" fill="#71717a"/>
        <text class="sans" x="16" y="9" font-size="11.5" font-weight="600" fill="#fafafa">HTML / Tailwind</text>
        <text class="mono" x="276" y="9" font-size="11" text-anchor="end" fill="#a1a1aa">6.5%</text>
      </g>

      <!-- C++ / Native -->
      <g transform="translate(0 78)">
        <circle cx="5" cy="5" r="4" fill="#52525b"/>
        <text class="sans" x="16" y="9" font-size="11.5" font-weight="600" fill="#fafafa">C++ / Native</text>
        <text class="mono" x="276" y="9" font-size="11" text-anchor="end" fill="#a1a1aa">4.5%</text>
      </g>
    </g>

    <!-- Bottom Badge -->
    <g transform="translate(20 186)">
      <rect width="276" height="24" rx="6" fill="#18181b" stroke="#27272a" stroke-width="0.8"/>
      <text class="mono" x="138" y="15.5" text-anchor="middle" font-size="8.5" letter-spacing="0.8" fill="#d4d4d8">FLUTTER · DART SPECIALIST</text>
    </g>

    <!-- Animated Border Laser -->
    <rect width="316" height="228" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.3" pathLength="1200" class="laser-stroke" style="animation-delay: -5.3s;"/>
  </g>
</svg>
