<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="engBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="engCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0a0f18"/>
    </linearGradient>

    <!-- Shimmer for active state -->
    <linearGradient id="engShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0">
        <animate attributeName="offset" values="-0.5;1.5" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="1">
        <animate attributeName="offset" values="-0.3;1.7" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0">
        <animate attributeName="offset" values="-0.1;1.9" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="engShadow">
      <feDropShadow dx="4" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="-2" dy="-2" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.02"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#engBg)"/>

  <!-- Module 1: Tactile Neumorphism & Spring Physics -->
  <g transform="translate(40, 25)" filter="url(#engShadow)">
    <rect width="260" height="270" rx="20" fill="url(#engCard)" stroke="#1e293b" stroke-width="0.8"/>
    <!-- Stage Pill -->
    <rect x="20" y="20" width="60" height="18" rx="9" fill="#1e293b"/>
    <text x="50" y="32" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" fill="#38bdf8" font-weight="700">PILLAR 01</text>
    
    <text x="20" y="62" font-family="'SF Pro Display','Inter',sans-serif" font-weight="900" font-size="14" fill="#f8fafc">Tactile Neumorphism</text>
    <text x="20" y="78" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#64748b">SPRING CURVES &amp; DUAL SHADOW</text>

    <!-- Animated Spring Element -->
    <g transform="translate(130, 140)">
      <circle cx="0" cy="0" r="42" fill="#090e1a" stroke="#1e293b" stroke-width="1.5"/>
      <!-- Tactile extruded button that presses in and pops out -->
      <circle cx="0" cy="0" r="30" fill="#1e293b" stroke="#334155" stroke-width="1.2">
        <animate attributeName="r" values="30;27;31;30" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="4" text-anchor="middle" font-size="16">✨</text>
    </g>

    <line x1="20" y1="205" x2="240" y2="205" stroke="#1e293b" stroke-width="0.6"/>
    <text x="20" y="226" font-family="'Inter',sans-serif" font-weight="400" font-size="10" fill="#94a3b8">
      <tspan x="20" dy="0">Layered inset &amp; extruded shadows.</tspan>
      <tspan x="20" dy="14">Physics-driven gesture damping</tspan>
      <tspan x="20" dy="14">inspired by Framer Motion.</tspan>
    </text>
  </g>

  <!-- Module 2: 120 FPS Impeller Target -->
  <g transform="translate(325, 25)" filter="url(#engShadow)">
    <rect width="260" height="270" rx="20" fill="url(#engCard)" stroke="#1e293b" stroke-width="0.8"/>
    <rect x="20" y="20" width="60" height="18" rx="9" fill="#1e293b"/>
    <text x="50" y="32" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" fill="#10b981" font-weight="700">PILLAR 02</text>
    
    <text x="20" y="62" font-family="'SF Pro Display','Inter',sans-serif" font-weight="900" font-size="14" fill="#f8fafc">120 FPS Impeller Target</text>
    <text x="20" y="78" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#64748b">ZERO SHADER JANK PIPELINE</text>

    <!-- 120 FPS Waveform Graph -->
    <g transform="translate(20, 110)">
      <rect width="220" height="70" rx="10" fill="#090e1a" stroke="#1e293b" stroke-width="0.8"/>
      <!-- Grid line -->
      <line x1="0" y1="35" x2="220" y2="35" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="2 3"/>
      <!-- 120 FPS Constant Smooth Line with animated shimmer -->
      <path d="M 10 35 L 50 35 L 60 32 L 70 38 L 80 35 L 130 35 L 140 33 L 150 37 L 160 35 L 210 35" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
      <circle cx="210" cy="35" r="3" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="1s" repeatCount="indefinite"/>
      </circle>
      <!-- Metric badge -->
      <text x="12" y="20" font-family="'JetBrains Mono',monospace" font-size="8" fill="#10b981" font-weight="800">8.33ms / FRAME (120 FPS)</text>
      <text x="12" y="58" font-family="'JetBrains Mono',monospace" font-size="7.5" fill="#64748b">0 Jank • Impeller GPU • Precached</text>
    </g>

    <line x1="20" y1="205" x2="240" y2="205" stroke="#1e293b" stroke-width="0.6"/>
    <text x="20" y="226" font-family="'Inter',sans-serif" font-weight="400" font-size="10" fill="#94a3b8">
      <tspan x="20" dy="0">Benchmarked on mid-tier Android.</tspan>
      <tspan x="20" dy="14">No rebuild storms. RepaintBoundary</tspan>
      <tspan x="20" dy="14">isolation on every heavy subtree.</tspan>
    </text>
  </g>

  <!-- Module 3: AI Streaming & Voice Matrix -->
  <g transform="translate(610, 25)" filter="url(#engShadow)">
    <rect width="260" height="270" rx="20" fill="url(#engCard)" stroke="#1e293b" stroke-width="0.8"/>
    <rect x="20" y="20" width="60" height="18" rx="9" fill="#1e293b"/>
    <text x="50" y="32" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" fill="#a855f7" font-weight="700">PILLAR 03</text>
    
    <text x="20" y="62" font-family="'SF Pro Display','Inter',sans-serif" font-weight="900" font-size="14" fill="#f8fafc">AI Streaming &amp; Voice</text>
    <text x="20" y="78" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#64748b">TOKEN-STREAM &amp; ON-DEVICE ML</text>

    <!-- Animated Token Streaming Box -->
    <g transform="translate(20, 110)">
      <rect width="220" height="70" rx="10" fill="#090e1a" stroke="#1e293b" stroke-width="0.8"/>
      <!-- Stream prompt -->
      <text x="12" y="22" font-family="'JetBrains Mono',monospace" font-size="8" fill="#a855f7">SSE STREAMING [GROQ / GEMINI]</text>
      <!-- Token stream visualization -->
      <g transform="translate(12, 38)">
        <rect x="0" y="0" width="28" height="14" rx="4" fill="#1e293b"/><text x="14" y="10" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="7" fill="#e2e8f0">User</text>
        <line x1="32" y1="7" x2="52" y2="7" stroke="#a855f7" stroke-width="1" stroke-dasharray="2 2"/>
        <rect x="56" y="0" width="34" height="14" rx="4" fill="#3b0764"/><text x="73" y="10" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="7" fill="#d8b4fe">LLM</text>
        <line x1="94" y1="7" x2="114" y2="7" stroke="#a855f7" stroke-width="1" stroke-dasharray="2 2"/>
        <rect x="118" y="0" width="30" height="14" rx="4" fill="#1e293b"/><text x="133" y="10" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="7" fill="#38bdf8">TTS</text>
      </g>
      <!-- Typing dots -->
      <circle cx="160" cy="45" r="2" fill="#a855f7"><animate attributeName="opacity" values="0.2;1;0.2" dur="1s" repeatCount="indefinite"/></circle>
      <circle cx="168" cy="45" r="2" fill="#a855f7"><animate attributeName="opacity" values="0.2;1;0.2" dur="1s" repeatCount="indefinite" begin="0.3s"/></circle>
      <circle cx="176" cy="45" r="2" fill="#a855f7"><animate attributeName="opacity" values="0.2;1;0.2" dur="1s" repeatCount="indefinite" begin="0.6s"/></circle>
    </g>

    <line x1="20" y1="205" x2="240" y2="205" stroke="#1e293b" stroke-width="0.6"/>
    <text x="20" y="226" font-family="'Inter',sans-serif" font-weight="400" font-size="10" fill="#94a3b8">
      <tspan x="20" dy="0">Realtime STT, OCR text extraction,</tspan>
      <tspan x="20" dy="14">voice mock interviews &amp; streaming</tspan>
      <tspan x="20" dy="14">responses with zero UI blockage.</tspan>
    </text>
  </g>

  <!-- Module 4: Clean Architecture & Drift ORM -->
  <g transform="translate(895, 25)" filter="url(#engShadow)">
    <rect width="260" height="270" rx="20" fill="url(#engCard)" stroke="#1e293b" stroke-width="0.8"/>
    <rect x="20" y="20" width="60" height="18" rx="9" fill="#1e293b"/>
    <text x="50" y="32" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" fill="#f59e0b" font-weight="700">PILLAR 04</text>
    
    <text x="20" y="62" font-family="'SF Pro Display','Inter',sans-serif" font-weight="900" font-size="14" fill="#f8fafc">Feature-First Architecture</text>
    <text x="20" y="78" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#64748b">MODULAR · DELETABLE · SOLID</text>

    <!-- Architecture Blocks -->
    <g transform="translate(20, 105)">
      <rect x="0" y="0" width="220" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
      <text x="110" y="14" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" fill="#f8fafc">PRESENTATION · WIDGETS + BLOC</text>
      
      <rect x="0" y="28" width="220" height="22" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.5"/>
      <text x="110" y="42" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" fill="#cbd5e1">DOMAIN · USE CASES &amp; REPOSITORIES</text>

      <rect x="0" y="56" width="220" height="22" rx="6" fill="#090e1a" stroke="#1e293b" stroke-width="0.5"/>
      <text x="110" y="70" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" fill="#94a3b8">DATA · DRIFT ORM / SUPABASE / REST</text>
    </g>

    <line x1="20" y1="205" x2="240" y2="205" stroke="#1e293b" stroke-width="0.6"/>
    <text x="20" y="226" font-family="'Inter',sans-serif" font-weight="400" font-size="10" fill="#94a3b8">
      <tspan x="20" dy="0">Type-safe SQL with Drift ORM.</tspan>
      <tspan x="20" dy="14">Strict encapsulation — every feature</tspan>
      <tspan x="20" dy="14">is an independent module.</tspan>
    </text>
  </g>
</svg>
