<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%">
  <defs>
    <!-- Monochromatic Obsidian Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0">
        <animate attributeName="offset" values="-0.5;1.5" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="15%" stop-color="#f8fafc" stop-opacity="1">
        <animate attributeName="offset" values="-0.35;1.65" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="30%" stop-color="#94a3b8" stop-opacity="0">
        <animate attributeName="offset" values="-0.2;1.8" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="neuEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.3)"/>
    </linearGradient>
    <radialGradient id="orbGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neuShadow">
      <feDropShadow dx="4" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="-2" dy="-2" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.03"/>
    </filter>

    <!-- Particles -->
    <circle id="particle" r="1.5" fill="#e2e8f0" opacity="0"/>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="0" y2="400" stroke="#e2e8f0" stroke-width="0.5">
      <animate attributeName="x1" values="0;1200" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1200" dur="20s" repeatCount="indefinite"/>
    </line>
  </g>
  <g opacity="0.025" stroke="#94a3b8" stroke-width="0.3">
    <line x1="100" y1="0" x2="100" y2="400"/><line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/><line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/><line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/><line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/><line x1="1000" y1="0" x2="1000" y2="400"/>
    <line x1="1100" y1="0" x2="1100" y2="400"/>
    <line x1="0" y1="50" x2="1200" y2="50"/><line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="150" x2="1200" y2="150"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="250" x2="1200" y2="250"/><line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
  </g>

  <!-- Floating Orbs -->
  <circle cx="150" cy="100" r="80" fill="url(#orbGlow1)">
    <animate attributeName="cx" values="150;200;150" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="100;140;100" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="300" r="100" fill="url(#orbGlow2)">
    <animate attributeName="cx" values="1050;980;1050" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="300;260;300" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="50" r="60" fill="url(#orbGlow1)">
    <animate attributeName="cy" values="50;80;50" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Floating Particles -->
  <g>
    <circle cx="200" cy="80" r="1" fill="#e2e8f0" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;40" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="350" r="1.5" fill="#cbd5e1" opacity="0">
      <animate attributeName="opacity" values="0;0.4;0" dur="5s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="cy" values="350;310" dur="5s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="700" cy="60" r="1" fill="#f8fafc" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="cy" values="60;30" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="950" cy="120" r="1.2" fill="#e2e8f0" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="4.5s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="cy" values="120;80" dur="4.5s" repeatCount="indefinite" begin="2s"/>
    </circle>
    <circle cx="100" cy="300" r="0.8" fill="#f8fafc" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="3s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="cy" values="300;270" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <circle cx="850" cy="350" r="1" fill="#94a3b8" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="6s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="cy" values="350;300" dur="6s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
    <circle cx="500" cy="300" r="1.3" fill="#e2e8f0" opacity="0">
      <animate attributeName="opacity" values="0;0.3;0" dur="5s" repeatCount="indefinite" begin="3s"/>
      <animate attributeName="cy" values="300;260" dur="5s" repeatCount="indefinite" begin="3s"/>
    </circle>
    <circle cx="300" cy="200" r="0.7" fill="#f8fafc" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="4s" repeatCount="indefinite" begin="2.5s"/>
      <animate attributeName="cy" values="200;170" dur="4s" repeatCount="indefinite" begin="2.5s"/>
    </circle>
    <circle cx="1100" cy="200" r="1.1" fill="#cbd5e1" opacity="0">
      <animate attributeName="opacity" values="0;0.4;0" dur="3.8s" repeatCount="indefinite" begin="1.2s"/>
      <animate attributeName="cy" values="200;160" dur="3.8s" repeatCount="indefinite" begin="1.2s"/>
    </circle>
  </g>

  <!-- Central Geometric Emblem -->
  <g transform="translate(600,185)" filter="url(#softGlow)">
    <!-- Outer spinning ring -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="8 12" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="30s" repeatCount="indefinite"/>
    </circle>
    <!-- Inner spinning ring (reverse) -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#334155" stroke-width="0.8" stroke-dasharray="4 8" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" values="360;0" dur="20s" repeatCount="indefinite"/>
    </circle>
    <!-- Pulsing core -->
    <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#334155" stroke-width="1.5" opacity="0.9">
      <animate attributeName="r" values="28;30;28" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- RA Monogram -->
    <text x="0" y="3" text-anchor="middle" dominant-baseline="central" font-family="'SF Pro Display','Inter',system-ui,sans-serif" font-weight="900" font-size="20" fill="url(#shimmer)" letter-spacing="3">RA</text>
  </g>

  <!-- Name: RABIA AZIZ -->
  <g filter="url(#glow)">
    <text x="600" y="120" text-anchor="middle" font-family="'SF Pro Display','Inter',system-ui,sans-serif" font-weight="900" font-size="52" fill="url(#textGlow)" letter-spacing="14" opacity="0">
      RABIA AZIZ
      <animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze" begin="0.3s"/>
    </text>
  </g>

  <!-- Shimmer line under name -->
  <rect x="400" y="135" width="400" height="1" fill="url(#shimmer)" rx="0.5" opacity="0">
    <animate attributeName="opacity" values="0;0.6" dur="1s" fill="freeze" begin="1s"/>
  </rect>

  <!-- Subtitle with cipher effect -->
  <text x="600" y="290" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',monospace" font-weight="400" font-size="14" fill="#64748b" letter-spacing="5" opacity="0">
    FLUTTER  ×  AI  ×  MOBILE ENGINEER
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze" begin="1.5s"/>
  </text>

  <!-- Animated dots -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze" begin="2s"/>
    <circle cx="530" cy="310" r="2" fill="#334155">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="310" r="2" fill="#475569">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="670" cy="310" r="2" fill="#334155">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
  </g>

  <!-- Location tag -->
  <text x="600" y="345" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',monospace" font-weight="300" font-size="11" fill="#475569" letter-spacing="3" opacity="0">
    📍 PAKISTAN  ·  OPEN TO REMOTE WORLDWIDE
    <animate attributeName="opacity" values="0;0.7" dur="1s" fill="freeze" begin="2.5s"/>
  </text>

  <!-- Scan line effect -->
  <rect x="0" y="0" width="1200" height="2" fill="#e2e8f0" opacity="0.03">
    <animate attributeName="y" values="-2;400" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner accents -->
  <g opacity="0.15">
    <line x1="30" y1="30" x2="80" y2="30" stroke="#475569" stroke-width="1"/>
    <line x1="30" y1="30" x2="30" y2="80" stroke="#475569" stroke-width="1"/>
    <line x1="1170" y1="30" x2="1120" y2="30" stroke="#475569" stroke-width="1"/>
    <line x1="1170" y1="30" x2="1170" y2="80" stroke="#475569" stroke-width="1"/>
    <line x1="30" y1="370" x2="80" y2="370" stroke="#475569" stroke-width="1"/>
    <line x1="30" y1="370" x2="30" y2="320" stroke="#475569" stroke-width="1"/>
    <line x1="1170" y1="370" x2="1120" y2="370" stroke="#475569" stroke-width="1"/>
    <line x1="1170" y1="370" x2="1170" y2="320" stroke="#475569" stroke-width="1"/>
  </g>

  <!-- Top status bar -->
  <text x="50" y="20" font-family="'JetBrains Mono',monospace" font-size="8" fill="#334155" letter-spacing="2">SWE.RABIAAZIZ</text>
  <text x="1150" y="20" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="8" fill="#334155" letter-spacing="2">v2026.11</text>

  <!-- Bottom edge fade -->
  <rect x="0" y="380" width="1200" height="20" fill="url(#bg)" opacity="0.8"/>
</svg>
