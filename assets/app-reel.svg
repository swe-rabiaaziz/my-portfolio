<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="reelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>

    <!-- Phone Hardware Gradients -->
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>

    <linearGradient id="phoneScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <linearGradient id="bezelShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="30%" stop-color="rgba(255,255,255,0.02)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)"/>
    </linearGradient>

    <!-- Monochrome White Glow Filter -->
    <filter id="phoneShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.04"/>
    </filter>

    <filter id="pulseGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="440" fill="url(#reelBg)"/>

  <!-- Ambient Floor Reflections -->
  <ellipse cx="600" cy="425" rx="540" ry="12" fill="#000000" opacity="0.9"/>
  <ellipse cx="165" cy="415" rx="120" ry="8" fill="#171717" opacity="0.6"/>
  <ellipse cx="455" cy="415" rx="120" ry="8" fill="#171717" opacity="0.6"/>
  <ellipse cx="745" cy="415" rx="120" ry="8" fill="#171717" opacity="0.6"/>
  <ellipse cx="1035" cy="415" rx="120" ry="8" fill="#171717" opacity="0.6"/>

  <!-- ==================== PHONE 1: CIVICCOACH (AI US CITIZENSHIP) ==================== -->
  <g transform="translate(45, 25)" filter="url(#phoneShadow)">
    <rect width="240" height="380" rx="34" fill="url(#phoneBody)" stroke="#404040" stroke-width="1.2"/>
    <rect width="240" height="380" rx="34" fill="url(#bezelShine)"/>
    <rect x="8" y="8" width="224" height="364" rx="28" fill="url(#phoneScreen)"/>

    <rect x="85" y="16" width="70" height="12" rx="6" fill="#000000" stroke="#262626" stroke-width="0.5"/>
    <circle cx="140" cy="22" r="2.5" fill="#262626"/>

    <g transform="translate(20, 42)">
      <text x="0" y="14" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#737373" letter-spacing="1.5">USCIS CIVICS 2026</text>
      <text x="0" y="30" font-family="'Inter',sans-serif" font-weight="900" font-size="15" fill="#fafafa">CivicCoach AI</text>
      <rect x="145" y="4" width="55" height="16" rx="8" fill="#171717" stroke="#404040" stroke-width="0.5"/>
      <text x="172" y="15" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="7" fill="#fafafa" font-weight="700">AI VOICE</text>

      <!-- Question Card -->
      <rect y="44" width="200" height="92" rx="14" fill="#171717" stroke="#262626" stroke-width="0.8"/>
      <text x="12" y="62" font-family="'JetBrains Mono',monospace" font-size="8" fill="#a3a3a3">ORAL INTERVIEW #42</text>
      <text x="12" y="78" font-family="'Inter',sans-serif" font-weight="600" font-size="9.5" fill="#e5e5e5">
        <tspan x="12" dy="0">"What is the supreme</tspan>
        <tspan x="12" dy="13">law of the land?"</tspan>
      </text>

      <!-- Monochrome Audio Frequency Waveform (Animated) -->
      <g transform="translate(12, 114)">
        <rect x="0" y="0" width="3" height="8" rx="1.5" fill="#fafafa">
          <animate attributeName="height" values="8;20;6;16;8" dur="1.2s" repeatCount="indefinite"/>
          <animate attributeName="y" values="0;-6;1;-4;0" dur="1.2s" repeatCount="indefinite"/>
        </rect>
        <rect x="6" y="0" width="3" height="14" rx="1.5" fill="#a3a3a3">
          <animate attributeName="height" values="14;6;22;10;14" dur="1.1s" repeatCount="indefinite"/>
          <animate attributeName="y" values="0;4;-4;2;0" dur="1.1s" repeatCount="indefinite"/>
        </rect>
        <rect x="12" y="0" width="3" height="20" rx="1.5" fill="#ffffff">
          <animate attributeName="height" values="20;10;26;8;20" dur="1.4s" repeatCount="indefinite"/>
          <animate attributeName="y" values="0;5;-3;6;0" dur="1.4s" repeatCount="indefinite"/>
        </rect>
        <rect x="18" y="0" width="3" height="12" rx="1.5" fill="#a3a3a3">
          <animate attributeName="height" values="12;22;8;18;12" dur="1.3s" repeatCount="indefinite"/>
          <animate attributeName="y" values="0;-5;2;-3;0" dur="1.3s" repeatCount="indefinite"/>
        </rect>
        <rect x="24" y="0" width="3" height="18" rx="1.5" fill="#fafafa">
          <animate attributeName="height" values="18;6;14;22;18" dur="1.0s" repeatCount="indefinite"/>
          <animate attributeName="y" values="0;6;2;-2;0" dur="1.0s" repeatCount="indefinite"/>
        </rect>
        <rect x="30" y="0" width="3" height="9" rx="1.5" fill="#737373">
          <animate attributeName="height" values="9;16;6;12;9" dur="1.5s" repeatCount="indefinite"/>
          <animate attributeName="y" values="0;-3;2;0;0" dur="1.5s" repeatCount="indefinite"/>
        </rect>
      </g>
      <text x="60" y="122" font-family="'JetBrains Mono',monospace" font-size="8" fill="#fafafa" font-weight="700">STT Match: 99.4%</text>

      <!-- SM-2 Spaced Repetition Card -->
      <rect y="146" width="200" height="66" rx="14" fill="#0e0e0e" stroke="#262626" stroke-width="0.8"/>
      <text x="12" y="164" font-family="'JetBrains Mono',monospace" font-size="8" fill="#737373">SM-2 ALGORITHM</text>
      <text x="12" y="180" font-family="'Inter',sans-serif" font-weight="700" font-size="11" fill="#fafafa">The Constitution</text>
      <rect x="12" y="192" width="176" height="6" rx="3" fill="#262626"/>
      <rect x="12" y="192" width="150" height="6" rx="3" fill="#fafafa"/>

      <!-- App Store Badge -->
      <g transform="translate(0, 260)">
        <rect width="200" height="42" rx="12" fill="#171717" stroke="#404040" stroke-width="0.8"/>
        <text x="25" y="25" font-size="14" fill="#fafafa">▶</text>
        <text x="50" y="20" font-family="'Inter',sans-serif" font-weight="800" font-size="10" fill="#fafafa">Google Play</text>
        <text x="50" y="32" font-family="'JetBrains Mono',monospace" font-size="7.5" fill="#a3a3a3">VERIFIED PRODUCTION</text>
      </g>
    </g>
  </g>

  <!-- ==================== PHONE 2: ZEMEN CALENDAR (ETHIOPIAN) ==================== -->
  <g transform="translate(335, 25)" filter="url(#phoneShadow)">
    <rect width="240" height="380" rx="34" fill="url(#phoneBody)" stroke="#404040" stroke-width="1.2"/>
    <rect width="240" height="380" rx="34" fill="url(#bezelShine)"/>
    <rect x="8" y="8" width="224" height="364" rx="28" fill="url(#phoneScreen)"/>

    <rect x="85" y="16" width="70" height="12" rx="6" fill="#000000" stroke="#262626" stroke-width="0.5"/>
    <circle cx="140" cy="22" r="2.5" fill="#262626"/>

    <g transform="translate(20, 42)">
      <text x="0" y="14" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#737373" letter-spacing="1.5">13-MONTH GEEZ</text>
      <text x="0" y="30" font-family="'Inter',sans-serif" font-weight="900" font-size="15" fill="#fafafa">Zemen Calendar</text>
      <rect x="145" y="4" width="55" height="16" rx="8" fill="#171717" stroke="#404040" stroke-width="0.5"/>
      <text x="172" y="15" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="7" fill="#fafafa" font-weight="700">12H CLOCK</text>

      <!-- Circular 12H Sunrise Clock -->
      <g transform="translate(100, 105)">
        <circle cx="0" cy="0" r="48" fill="#0e0e0e" stroke="#262626" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="44" fill="none" stroke="#404040" stroke-width="0.5" stroke-dasharray="3 5"/>
        <circle cx="0" cy="-36" r="2" fill="#fafafa"/>
        <circle cx="36" cy="0" r="2" fill="#737373"/>
        <circle cx="0" cy="36" r="2" fill="#737373"/>
        <circle cx="-36" cy="0" r="2" fill="#737373"/>
        <!-- Clock Hands -->
        <line x1="0" y1="0" x2="0" y2="-26" stroke="#fafafa" stroke-width="2" stroke-linecap="round">
          <animateTransform attributeName="transform" type="rotate" values="0;360" dur="60s" repeatCount="indefinite"/>
        </line>
        <line x1="0" y1="0" x2="16" y2="8" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
        <text x="0" y="18" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="7.5" fill="#737373">SUNRISE 12:00</text>
      </g>

      <!-- Calendar Month View Snippet -->
      <rect y="165" width="200" height="82" rx="14" fill="#171717" stroke="#262626" stroke-width="0.8"/>
      <text x="12" y="183" font-family="'Inter',sans-serif" font-weight="800" font-size="10" fill="#fafafa">ታኅሣሥ (Tahsas) • 2018</text>
      <text x="12" y="196" font-family="'JetBrains Mono',monospace" font-size="7.5" fill="#737373">Orthodox Tewahedo Fasting</text>
      <!-- Days dots -->
      <g transform="translate(12, 206)">
        <rect x="0" y="0" width="22" height="22" rx="6" fill="#0a0a0a" stroke="#262626" stroke-width="0.5"/><text x="11" y="14" text-anchor="middle" font-size="8" fill="#a3a3a3">፩</text>
        <rect x="26" y="0" width="22" height="22" rx="6" fill="#0a0a0a" stroke="#262626" stroke-width="0.5"/><text x="37" y="14" text-anchor="middle" font-size="8" fill="#a3a3a3">፪</text>
        <rect x="52" y="0" width="22" height="22" rx="6" fill="#0a0a0a" stroke="#262626" stroke-width="0.5"/><text x="63" y="14" text-anchor="middle" font-size="8" fill="#a3a3a3">፫</text>
        <rect x="78" y="0" width="22" height="22" rx="6" fill="#fafafa"/><text x="89" y="14" text-anchor="middle" font-size="8" fill="#0a0a0a" font-weight="900">፬</text>
        <rect x="104" y="0" width="22" height="22" rx="6" fill="#0a0a0a" stroke="#262626" stroke-width="0.5"/><text x="115" y="14" text-anchor="middle" font-size="8" fill="#a3a3a3">፭</text>
        <rect x="130" y="0" width="22" height="22" rx="6" fill="#0a0a0a" stroke="#262626" stroke-width="0.5"/><text x="141" y="14" text-anchor="middle" font-size="8" fill="#a3a3a3">፮</text>
        <rect x="156" y="0" width="22" height="22" rx="6" fill="#0a0a0a" stroke="#262626" stroke-width="0.5"/><text x="167" y="14" text-anchor="middle" font-size="8" fill="#a3a3a3">፯</text>
      </g>

      <!-- App Store Badge -->
      <g transform="translate(0, 260)">
        <rect width="200" height="42" rx="12" fill="#171717" stroke="#404040" stroke-width="0.8"/>
        <text x="25" y="25" font-size="14" fill="#fafafa">▶</text>
        <text x="50" y="20" font-family="'Inter',sans-serif" font-weight="800" font-size="10" fill="#fafafa">Google Play</text>
        <text x="50" y="32" font-family="'JetBrains Mono',monospace" font-size="7.5" fill="#a3a3a3">VERIFIED PRODUCTION</text>
      </g>
    </g>
  </g>

  <!-- ==================== PHONE 3: ZENPEACE (POMODORO & FLOW) ==================== -->
  <g transform="translate(625, 25)" filter="url(#phoneShadow)">
    <rect width="240" height="380" rx="34" fill="url(#phoneBody)" stroke="#404040" stroke-width="1.2"/>
    <rect width="240" height="380" rx="34" fill="url(#bezelShine)"/>
    <rect x="8" y="8" width="224" height="364" rx="28" fill="url(#phoneScreen)"/>

    <rect x="85" y="16" width="70" height="12" rx="6" fill="#000000" stroke="#262626" stroke-width="0.5"/>
    <circle cx="140" cy="22" r="2.5" fill="#262626"/>

    <g transform="translate(20, 42)">
      <text x="0" y="14" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#737373" letter-spacing="1.5">MINDFUL FLOW</text>
      <text x="0" y="30" font-family="'Inter',sans-serif" font-weight="900" font-size="15" fill="#fafafa">ZenPeace</text>
      <rect x="145" y="4" width="55" height="16" rx="8" fill="#171717" stroke="#404040" stroke-width="0.5"/>
      <text x="172" y="15" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="7" fill="#fafafa" font-weight="700">AMBIENT</text>

      <!-- Breathing Ring & Timer -->
      <g transform="translate(100, 105)">
        <circle cx="0" cy="0" r="46" fill="none" stroke="#fafafa" stroke-width="1.5" stroke-dasharray="140 180" opacity="0.7">
          <animate attributeName="r" values="44;48;44" dur="4s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="rotate" values="0;360" dur="20s" repeatCount="indefinite"/>
        </circle>
        <circle cx="0" cy="0" r="38" fill="#0e0e0e" stroke="#262626" stroke-width="1"/>
        <text x="0" y="6" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-weight="800" font-size="18" fill="#fafafa">25:00</text>
        <text x="0" y="20" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="7" fill="#737373">FOCUS SESSION</text>
      </g>

      <!-- Ambient Soundscape Selector -->
      <rect y="165" width="200" height="82" rx="14" fill="#171717" stroke="#262626" stroke-width="0.8"/>
      <text x="12" y="184" font-family="'Inter',sans-serif" font-weight="700" font-size="10" fill="#fafafa">🌧️ Rain + Lofi Beats</text>
      <text x="12" y="198" font-family="'JetBrains Mono',monospace" font-size="7.5" fill="#737373">just_audio • fl_chart streak</text>
      <!-- Soundwave bars -->
      <g transform="translate(12, 212)">
        <rect x="0" y="2" width="2" height="12" rx="1" fill="#fafafa"><animate attributeName="height" values="12;4;16;8;12" dur="1.2s" repeatCount="indefinite"/></rect>
        <rect x="6" y="2" width="2" height="16" rx="1" fill="#a3a3a3"><animate attributeName="height" values="16;8;20;6;16" dur="0.9s" repeatCount="indefinite"/></rect>
        <rect x="12" y="2" width="2" height="8" rx="1" fill="#fafafa"><animate attributeName="height" values="8;18;4;14;8" dur="1.1s" repeatCount="indefinite"/></rect>
        <rect x="18" y="2" width="2" height="14" rx="1" fill="#737373"><animate attributeName="height" values="14;6;18;10;14" dur="1.4s" repeatCount="indefinite"/></rect>
        <rect x="24" y="2" width="2" height="18" rx="1" fill="#fafafa"><animate attributeName="height" values="18;10;6;16;18" dur="1.0s" repeatCount="indefinite"/></rect>
        <text x="35" y="13" font-family="'JetBrains Mono',monospace" font-size="8" fill="#e5e5e5">4-Day Streak ✦</text>
      </g>

      <!-- App Store Badge -->
      <g transform="translate(0, 260)">
        <rect width="200" height="42" rx="12" fill="#171717" stroke="#404040" stroke-width="0.8"/>
        <text x="25" y="25" font-size="14" fill="#fafafa">▶</text>
        <text x="50" y="20" font-family="'Inter',sans-serif" font-weight="800" font-size="10" fill="#fafafa">Google Play</text>
        <text x="50" y="32" font-family="'JetBrains Mono',monospace" font-size="7.5" fill="#a3a3a3">VERIFIED PRODUCTION</text>
      </g>
    </g>
  </g>

  <!-- ==================== PHONE 4: HEALTH TRACKER (VITALS & BP) ==================== -->
  <g transform="translate(915, 25)" filter="url(#phoneShadow)">
    <rect width="240" height="380" rx="34" fill="url(#phoneBody)" stroke="#404040" stroke-width="1.2"/>
    <rect width="240" height="380" rx="34" fill="url(#bezelShine)"/>
    <rect x="8" y="8" width="224" height="364" rx="28" fill="url(#phoneScreen)"/>

    <rect x="85" y="16" width="70" height="12" rx="6" fill="#000000" stroke="#262626" stroke-width="0.5"/>
    <circle cx="140" cy="22" r="2.5" fill="#262626"/>

    <g transform="translate(20, 42)">
      <text x="0" y="14" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#737373" letter-spacing="1.5">VITALS MONITOR</text>
      <text x="0" y="30" font-family="'Inter',sans-serif" font-weight="900" font-size="15" fill="#fafafa">Health Tracker</text>
      <rect x="145" y="4" width="55" height="16" rx="8" fill="#171717" stroke="#404040" stroke-width="0.5"/>
      <text x="172" y="15" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="7" fill="#fafafa" font-weight="700">72 BPM</text>

      <!-- Blood Pressure & Heart Rate Card -->
      <rect y="44" width="200" height="92" rx="14" fill="#171717" stroke="#262626" stroke-width="0.8"/>
      <text x="12" y="62" font-family="'JetBrains Mono',monospace" font-size="8" fill="#a3a3a3">BLOOD PRESSURE</text>
      <text x="12" y="88" font-family="'JetBrains Mono',monospace" font-weight="900" font-size="20" fill="#fafafa">120<tspan font-size="14" fill="#737373"> / </tspan>80</text>
      <text x="125" y="86" font-family="'Inter',sans-serif" font-size="9" fill="#fafafa" font-weight="700">OPTIMAL</text>

      <!-- Pulsing Monochrome ECG Cardiac Waveform Line -->
      <g transform="translate(12, 104)" filter="url(#pulseGlow)">
        <path d="M 0 12 L 30 12 L 36 3 L 42 22 L 48 6 L 54 16 L 60 12 L 176 12" fill="none" stroke="#fafafa" stroke-width="1.8" stroke-linecap="round">
          <animate attributeName="stroke-dasharray" values="0,200;180,0;0,200" dur="2.4s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- Historical Logs Plate -->
      <rect y="146" width="200" height="66" rx="14" fill="#0e0e0e" stroke="#262626" stroke-width="0.8"/>
      <text x="12" y="164" font-family="'JetBrains Mono',monospace" font-size="8" fill="#737373">WEEKLY TREND (SQFLITE)</text>
      <!-- Mini Bar Chart -->
      <g transform="translate(12, 174)">
        <rect x="0" y="12" width="16" height="18" rx="3" fill="#262626"/>
        <rect x="24" y="8" width="16" height="22" rx="3" fill="#262626"/>
        <rect x="48" y="4" width="16" height="26" rx="3" fill="#262626"/>
        <rect x="72" y="10" width="16" height="20" rx="3" fill="#262626"/>
        <rect x="96" y="2" width="16" height="28" rx="3" fill="#fafafa"/>
        <rect x="120" y="6" width="16" height="24" rx="3" fill="#262626"/>
        <rect x="144" y="4" width="16" height="26" rx="3" fill="#262626"/>
      </g>

      <!-- App Store Badge -->
      <g transform="translate(0, 260)">
        <rect width="200" height="42" rx="12" fill="#171717" stroke="#404040" stroke-width="0.8"/>
        <text x="25" y="25" font-size="14" fill="#fafafa">▶</text>
        <text x="50" y="20" font-family="'Inter',sans-serif" font-weight="800" font-size="10" fill="#fafafa">Google Play</text>
        <text x="50" y="32" font-family="'JetBrains Mono',monospace" font-size="7.5" fill="#a3a3a3">VERIFIED PRODUCTION</text>
      </g>
    </g>
  </g>
</svg>
