<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" height="220" role="img" aria-label="Rabia Aziz GitHub Statistics and Most Used Languages">
  <defs>
    <!-- Background & Plate Gradients -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141416"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="borderSweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f3f46"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#3f3f46"/>
    </linearGradient>
    <linearGradient id="rankHalo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#71717a"/>
    </linearGradient>

    <!-- Language Bar Gradients -->
    <linearGradient id="barDart" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d4d4d8"/>
    </linearGradient>
    <linearGradient id="barTs" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a1a1aa"/>
      <stop offset="1" stop-color="#71717a"/>
    </linearGradient>
    <linearGradient id="barHtml" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#71717a"/>
      <stop offset="1" stop-color="#52525b"/>
    </linearGradient>
    <linearGradient id="barCpp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#52525b"/>
      <stop offset="1" stop-color="#3f3f46"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif; }
    
    @keyframes laser {
      0% { stroke-dashoffset: 1400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseA {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes rankSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes barAnim {
      0% { width: 0; }
      100% { }
    }
    @keyframes liveBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .stat-laser {
      stroke-dasharray: 100 1300;
      animation: laser 8s linear infinite;
    }
  </style>

  <!-- ================= CARD 1: GITHUB STATS (LEFT, width 486) ================= -->
  <g transform="translate(4 6)">
    <!-- Base Card -->
    <rect width="486" height="208" rx="16" fill="url(#cardBg)" stroke="#27272a" stroke-width="1.2" filter="url(#cardShadow)"/>
    
    <!-- Header -->
    <g transform="translate(24 22)">
      <path d="M0 0 L12 0 L15 15 L3 15 Z" fill="#fafafa" fill-opacity="0.1"/>
      <!-- GitHub Icon -->
      <path d="M10 2C5.58 2 2 5.58 2 10C2 13.54 4.29 16.53 7.47 17.59C7.87 17.66 8.01 17.42 8.01 17.21C8.01 17.02 8 16.52 8 15.84C5.78 16.32 5.31 14.77 5.31 14.77C4.95 13.84 4.43 13.6 4.43 13.6C3.7 13.11 4.48 13.12 4.48 13.12C5.29 13.18 5.71 13.95 5.71 13.95C6.42 15.17 7.58 14.82 8.03 14.61C8.1 14.1 8.31 13.74 8.53 13.54C6.76 13.34 4.9 12.65 4.9 9.61C4.9 8.74 5.21 8.03 5.72 7.48C5.64 7.28 5.36 6.47 5.8 5.37C5.8 5.37 6.47 5.16 7.99 6.19C8.62 6.01 9.3 5.93 10 5.93C10.7 5.93 11.38 6.01 12.01 6.19C13.53 5.16 14.2 5.37 14.2 5.37C14.64 6.47 14.36 7.28 14.28 7.48C14.79 8.03 15.1 8.74 15.1 9.61C15.1 12.66 13.23 13.33 11.46 13.53C11.75 13.78 12.01 14.28 12.01 15.03C12.01 16.12 12 17 12 17.21C12 17.42 12.14 17.67 12.55 17.59C15.72 16.53 18 13.54 18 10C18 5.58 14.42 2 10 2Z" fill="#fafafa"/>
      <text class="sans" x="26" y="14" font-size="14" font-weight="700" fill="#fafafa">Rabia Aziz's GitHub Stats</text>
    </g>

    <!-- Stat Items Grid -->
    <g transform="translate(24 58)">
      <!-- Item 1: Total Contributions -->
      <g transform="translate(0 0)">
        <text class="sans" x="0" y="14" font-size="12" fill="#a1a1aa">Total Contributions</text>
        <text class="mono" x="220" y="14" font-size="13" font-weight="700" text-anchor="end" fill="#fafafa">81+</text>
      </g>
      <line x1="0" y1="24" x2="230" y2="24" stroke="#27272a" stroke-width="0.8"/>

      <!-- Item 2: Total Commits & PRs -->
      <g transform="translate(0 34)">
        <text class="sans" x="0" y="14" font-size="12" fill="#a1a1aa">Production Repositories</text>
        <text class="mono" x="220" y="14" font-size="13" font-weight="700" text-anchor="end" fill="#fafafa">14</text>
      </g>
      <line x1="0" y1="58" x2="230" y2="58" stroke="#27272a" stroke-width="0.8"/>

      <!-- Item 3: Total Stars & Forks -->
      <g transform="translate(0 68)">
        <text class="sans" x="0" y="14" font-size="12" fill="#a1a1aa">Impeller Optimization</text>
        <text class="mono" x="220" y="14" font-size="13" font-weight="700" text-anchor="end" fill="#fafafa">120 FPS</text>
      </g>
      <line x1="0" y1="92" x2="230" y2="92" stroke="#27272a" stroke-width="0.8"/>

      <!-- Item 4: Architecture Standard -->
      <g transform="translate(0 102)">
        <text class="sans" x="0" y="14" font-size="12" fill="#a1a1aa">Clean Architecture</text>
        <text class="mono" x="220" y="14" font-size="13" font-weight="700" text-anchor="end" fill="#fafafa">100% Pass</text>
      </g>
    </g>

    <!-- Right Side: Grade Badge (A+) -->
    <g transform="translate(378 106)">
      <!-- Outer Rotating Halo -->
      <circle cx="0" cy="0" r="48" fill="none" stroke="#27272a" stroke-width="3"/>
      <circle cx="0" cy="0" r="48" fill="none" stroke="#fafafa" stroke-width="3.5" stroke-dasharray="240 60" stroke-linecap="round" transform="rotate(-45)"/>
      <circle cx="0" cy="0" r="38" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
      
      <!-- Grade A+ -->
      <text class="sans" x="0" y="10" text-anchor="middle" font-size="30" font-weight="900" fill="#ffffff" style="transform-box: fill-box; transform-origin: center; animation: pulseA 2.6s ease-in-out infinite;">A+</text>
      <text class="mono" x="0" y="64" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="1" fill="#a1a1aa">SENIOR CRAFT</text>
    </g>

    <!-- Animated Border Laser -->
    <rect width="486" height="208" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1.3" pathLength="1400" class="stat-laser"/>
  </g>

  <!-- ================= CARD 2: TOP LANGUAGES (RIGHT, width 486) ================= -->
  <g transform="translate(510 6)">
    <!-- Base Card -->
    <rect width="486" height="208" rx="16" fill="url(#cardBg)" stroke="#27272a" stroke-width="1.2" filter="url(#cardShadow)"/>

    <!-- Header -->
    <g transform="translate(24 22)">
      <!-- Code bracket icon -->
      <text class="mono" x="0" y="14" font-size="14" font-weight="700" fill="#fafafa">&lt;/&gt;</text>
      <text class="sans" x="28" y="14" font-size="14" font-weight="700" fill="#fafafa">Most Used Languages</text>
      
      <!-- Live Sync Dot -->
      <circle cx="438" cy="10" r="3.5" fill="#fafafa" style="animation: liveBlink 1.8s infinite;"/>
      <text class="mono" x="426" y="13" text-anchor="end" font-size="9" fill="#71717a">VERIFIED</text>
    </g>

    <!-- Multi-segmented Progress Bar -->
    <g transform="translate(24 50)">
      <rect width="438" height="10" rx="5" fill="#27272a"/>
      <!-- Dart: 74.2% -> width 325 -->
      <rect width="325" height="10" rx="5" fill="url(#barDart)"/>
      <!-- TypeScript: 14.8% -> width 65, x=327 -->
      <rect x="327" width="65" height="10" rx="3" fill="url(#barTs)"/>
      <!-- HTML/CSS: 6.5% -> width 28, x=394 -->
      <rect x="394" width="28" height="10" rx="2" fill="url(#barHtml)"/>
      <!-- C++: 4.5% -> width 14, x=424 -->
      <rect x="424" width="14" height="10" rx="2" fill="url(#barCpp)"/>
    </g>

    <!-- Languages Breakdown List (2 Columns) -->
    <g transform="translate(24 82)">
      <!-- Column 1: Dart & TypeScript -->
      <g transform="translate(0 0)">
        <!-- Dart -->
        <circle cx="6" cy="6" r="4.5" fill="#ffffff"/>
        <text class="sans" x="18" y="10" font-size="12.5" font-weight="600" fill="#fafafa">Dart</text>
        <text class="mono" x="180" y="10" font-size="12" text-anchor="end" fill="#a1a1aa">74.2%</text>

        <!-- TypeScript / JS -->
        <g transform="translate(0 32)">
          <circle cx="6" cy="6" r="4.5" fill="#a1a1aa"/>
          <text class="sans" x="18" y="10" font-size="12.5" font-weight="600" fill="#fafafa">TypeScript / JS</text>
          <text class="mono" x="180" y="10" font-size="12" text-anchor="end" fill="#a1a1aa">14.8%</text>
        </g>
      </g>

      <!-- Column 2: HTML/CSS & C++ / Native -->
      <g transform="translate(236 0)">
        <!-- HTML & CSS -->
        <circle cx="6" cy="6" r="4.5" fill="#71717a"/>
        <text class="sans" x="18" y="10" font-size="12.5" font-weight="600" fill="#fafafa">HTML / CSS / Tailwind</text>
        <text class="mono" x="202" y="10" font-size="12" text-anchor="end" fill="#a1a1aa">6.5%</text>

        <!-- C++ / Native -->
        <g transform="translate(0 32)">
          <circle cx="6" cy="6" r="4.5" fill="#52525b"/>
          <text class="sans" x="18" y="10" font-size="12.5" font-weight="600" fill="#fafafa">C++ / CMake / Native</text>
          <text class="mono" x="202" y="10" font-size="12" text-anchor="end" fill="#a1a1aa">4.5%</text>
        </g>
      </g>
    </g>

    <!-- Bottom Tech Focus Badge -->
    <g transform="translate(24 162)">
      <rect width="438" height="28" rx="6" fill="#18181b" stroke="#27272a" stroke-width="0.8"/>
      <text class="mono" x="219" y="17.5" text-anchor="middle" font-size="9.5" letter-spacing="0.8" fill="#d4d4d8">CORE SPECIALIZATION: FLUTTER · DART · AI MOBILE APPS</text>
    </g>

    <!-- Animated Border Laser -->
    <rect width="486" height="208" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1.3" pathLength="1400" class="stat-laser" style="animation-delay: -4s;"/>
  </g>
</svg>
