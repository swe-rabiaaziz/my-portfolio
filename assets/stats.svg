<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-label="Stats: 4+ production apps on Google Play, 1+ year of Flutter, AI and ML integrations with Groq, Gemini and ML Kit, and 100% passion for MVVM and clean architecture" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0a0a"/><stop offset="0.5" stop-color="#141414"/><stop offset="1" stop-color="#0a0a0a"/></linearGradient>
<linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171717"/><stop offset="1" stop-color="#0f0f0f"/></linearGradient>
<linearGradient id="numGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#8c8c8c"/></linearGradient>
<linearGradient id="borderSweep" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#525252"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#525252"/></linearGradient>
<linearGradient id="hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="shineG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="beatG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#525252"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
<radialGradient id="glowW" cx="1" cy="0" r="0.9"><stop offset="0" stop-color="#fff" stop-opacity="0.075"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="orb" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity="0.05"/></pattern>
<filter id="neuShadow" x="-10%" y="-10%" width="120%" height="125%">
  <feDropShadow dx="4" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.7"/>
  <feDropShadow dx="-1" dy="-1" stdDeviation="4" flood-color="#fff" flood-opacity="0.025"/>
</filter>
<clipPath id="plateClip"><rect width="1000" height="380" rx="28"/></clipPath>
<clipPath id="clipHero"><rect width="381" height="333" rx="24"/></clipPath>
<clipPath id="clipS"><rect width="271" height="159" rx="22"/></clipPath>
<clipPath id="clipW"><rect width="557" height="159" rx="22"/></clipPath>
<clipPath id="odoHero"><rect x="24" y="50" width="104" height="156"/></clipPath>
<clipPath id="odoSmall"><rect x="18" y="40" width="46" height="62"/></clipPath>
</defs>
<style>
.idx  { font: 700 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; fill: #737373; }
.ttl  { font: 800 18px 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif; fill: #fafafa; letter-spacing: -0.3px; }
.dsc  { font: 400 12.5px 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif; fill: #a3a3a3; }
.mono { font: 500 9.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #d4d4d4; }
.monog{ font: 600 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #737373; letter-spacing: 1.5px; }
.chip { font: 500 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #b4b4b4; }
.num  { font-family: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif; font-weight: 900; letter-spacing: -3px; fill: url(#numGrad); }
.plus { font-family: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif; font-weight: 300; fill: #737373; }

.rise  { animation: rise 0.9s cubic-bezier(.2,.8,.2,1) both; }
.sweep { stroke-dasharray: 120 880; animation: sweep 8s linear infinite; }
.shine { animation: shine 9s ease-in-out infinite; }
.roll4 { animation: roll4 7s cubic-bezier(.16,.84,.24,1) infinite; }
.roll1 { animation: roll1 7s cubic-bezier(.16,.84,.24,1) infinite; }
.fill  { animation: fill 7s cubic-bezier(.3,.7,.2,1) infinite; }
.tile  { animation: tile 4.4s ease-in-out infinite; }
.sk    { animation: sk 2.4s ease-in-out infinite; }
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
.ringo { transform-box: fill-box; transform-origin: center; animation: ringo 3s ease-out infinite; }
.node  { animation: node 4.8s ease-in-out infinite; }
.beat  { stroke-dasharray: 150 850; animation: beat 3.2s linear infinite; }
.drift { animation: drift 18s ease-in-out infinite alternate; }

@keyframes rise  { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes sweep { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
@keyframes shine { 0% { transform: translateX(0); } 30%,100% { transform: translateX(700px); } }
@keyframes roll4 { 0% { transform: translateY(0); } 22%, 86% { transform: translateY(-600px); } 96%, 100% { transform: translateY(0); } }
@keyframes roll1 { 0% { transform: translateY(0); } 22%, 86% { transform: translateY(-70px); } 96%, 100% { transform: translateY(0); } }
@keyframes fill  { 0% { stroke-dashoffset: 188.5; } 25%, 86% { stroke-dashoffset: 0; } 96%, 100% { stroke-dashoffset: 188.5; } }
@keyframes tile  { 0%,100% { stroke-opacity: .25; fill-opacity: 0; } 8%,26% { stroke-opacity: 1; fill-opacity: .12; } 36% { stroke-opacity: .25; fill-opacity: 0; } }
@keyframes sk    { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
@keyframes pulse { 0%,100% { transform: scale(1); opacity: .95; } 50% { transform: scale(1.5); opacity: .45; } }
@keyframes ringo { 0% { transform: scale(.6); opacity: .6; } 100% { transform: scale(1.7); opacity: 0; } }
@keyframes node  { 0%,100% { stroke-opacity: .25; fill-opacity: 0; } 6%,20% { stroke-opacity: 1; fill-opacity: .12; } 30% { stroke-opacity: .25; fill-opacity: 0; } }
@keyframes beat  { from { stroke-dashoffset: 150; } to { stroke-dashoffset: -1000; } }
@keyframes drift { to { transform: translate(60px, 36px); } }

@media (prefers-reduced-motion: reduce) {
  .rise,.sweep,.shine,.roll4,.roll1,.fill,.tile,.sk,.pulse,.ringo,.node,.beat,.drift { animation: none; }
}
</style>
