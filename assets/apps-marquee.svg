<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="100%">
  <defs>
    <linearGradient id="marqBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="10%" stop-color="#0f172a"/>
      <stop offset="90%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="fadeL" x1="0%" y1="0%" x2="100%" y2="0%">
