      <tspan x="1440">FIREBASE</tspan>
      <tspan x="1600" fill="#1e293b">✦</tspan>
      <tspan x="1640">CROSS-PLATFORM</tspan>
      <tspan x="1900" fill="#1e293b">✦</tspan>
      <tspan x="1940">CIVICCOACH</tspan>
      <tspan x="2120" fill="#1e293b">✦</tspan>
      <tspan x="2160">ZEMEN CALENDAR</tspan>
      <tspan x="2410" fill="#1e293b">✦</tspan>
      <tspan x="2450">ZENPEACE</tspan>
      <tspan x="2610" fill="#1e293b">✦</tspan>
      <tspan x="2650">HEALTH TRACKER</tspan>
      <tspan x="2900" fill="#1e293b">✦</tspan>
      <tspan x="2940">FLUTTER × AI</tspan>
      <tspan x="3140" fill="#1e293b">✦</tspan>
      <tspan x="3180">SUPABASE</tspan>
      <tspan x="3340" fill="#1e293b">✦</tspan>
