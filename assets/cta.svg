    <text class="lbl" x="26" y="316" style="font-size:8.5px">PKT / UTC+5 · REPLIES WITHIN 24 HOURS</text>

    <rect class="sweep" x="0.5" y="0.5" width="356" height="324" rx="24" fill="none" stroke="url(#borderSweep)" stroke-opacity="0.85" stroke-width="1.3" pathLength="1000" stroke-linecap="round"/>
  </g>
</g>

<!-- PLATE BORDER -->
<rect x="0.5" y="0.5" width="999" height="379" rx="27.5" fill="none" stroke="#fff" stroke-opacity="0.08"/>
</svg>
