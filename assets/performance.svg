<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-label="Performance standard: 60 and 120 fps frame budget, Impeller testing, widget rebuild optimisation">
  <defs>
    <!-- Pure Monochromatic Bar Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#404040"/>
    </linearGradient>
    <clipPath id="chartClip"><rect x="32" y="64" width="420" height="154"/></clipPath>
    <g id="barsGroup">
      <rect x="0" y="154" width="10" height="60" rx="2"/>
      <rect x="16" y="130" width="10" height="84" rx="2"/>
      <rect x="32" y="166" width="10" height="48" rx="2"/>
      <rect x="48" y="142" width="10" height="72" rx="2"/>
      <rect x="64" y="118" width="10" height="96" rx="2"/>
      <rect x="80" y="160" width="10" height="54" rx="2"/>
      <rect x="96" y="136" width="10" height="78" rx="2"/>
      <rect x="112" y="172" width="10" height="42" rx="2"/>
      <rect x="128" y="124" width="10" height="90" rx="2"/>
      <rect x="144" y="148" width="10" height="66" rx="2"/>
      <rect x="160" y="106" width="10" height="108" rx="2"/>
      <rect x="176" y="163" width="10" height="51" rx="2"/>
      <rect x="192" y="139" width="10" height="75" rx="2"/>
      <rect x="208" y="151" width="10" height="63" rx="2"/>
      <rect x="224" y="115" width="10" height="99" rx="2"/>
      <rect x="240" y="157" width="10" height="57" rx="2"/>
      <rect x="256" y="133" width="10" height="81" rx="2"/>
      <rect x="272" y="169" width="10" height="45" rx="2"/>
      <rect x="288" y="121" width="10" height="93" rx="2"/>
      <rect x="304" y="145" width="10" height="69" rx="2"/>
      <rect x="320" y="127" width="10" height="87" rx="2"/>
      <rect x="336" y="166" width="10" height="48" rx="2"/>
      <rect x="352" y="112" width="10" height="102" rx="2"/>
      <rect x="368" y="154" width="10" height="60" rx="2"/>
      <rect x="384" y="136" width="10" height="78" rx="2"/>
    </g>
  </defs>

  <rect x="0.75" y="0.75" width="998.5" height="268.5" rx="20" fill="#0a0a0a" stroke="#262626" stroke-width="1.5"/>

  <!-- Left: Frame Time Chart -->
  <g font-family="'JetBrains Mono',monospace" font-size="12" letter-spacing="2" fill="#737373">
    <text x="32" y="42">FRAME TIME (DEVTOOLS BENCHMARK)</text>
  </g>
  <g font-family="'JetBrains Mono',monospace" font-size="9.5" letter-spacing="1.5" fill="#fafafa">
    <text x="452" y="82" text-anchor="end">8.33ms (120 FPS BUDGET)</text>
  </g>

  <!-- Animated Frametime Graph -->
  <g clip-path="url(#chartClip)">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-400 0" dur="7s" repeatCount="indefinite"/>
      <g transform="translate(32 0)" fill="url(#barGrad)" fill-opacity="0.85">
        <use href="#barsGroup" x="0"/>
        <use href="#barsGroup" x="400"/>
        <use href="#barsGroup" x="800"/>
      </g>
    </g>
  </g>
  <line x1="32" y1="214.5" x2="452" y2="214.5" stroke="#404040"/>
  <line x1="32" y1="90" x2="452" y2="90" stroke="#fafafa" stroke-opacity="0.75" stroke-dasharray="4 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <g>
    <circle cx="36" cy="245" r="3.5" fill="#fafafa">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="48" y="249" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="1.5" fill="#a3a3a3">ZERO DROPPED FRAMES · 100% UNDER BUDGET</text>
  </g>

  <!-- Vertical Divider -->
  <line x1="488" y1="28" x2="488" y2="242" stroke="#262626"/>

  <!-- Right: The 120 FPS Standard Details -->
  <text x="518" y="42" font-family="'JetBrains Mono',monospace" font-size="12" letter-spacing="2" fill="#737373">ENGINEERING SPECIFICATION</text>
  <g text-anchor="end">
    <text x="968" y="48" font-family="'Inter',sans-serif" font-size="28" font-weight="900" fill="#fafafa">120<tspan font-size="13" font-weight="700" fill="#737373" letter-spacing="2"> FPS</tspan>
      <animate attributeName="opacity" values="1;0.6;1" dur="2.4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Item 1 -->
  <g transform="translate(518 86)" font-family="'Inter',sans-serif">
    <circle cx="10" cy="-4" r="8" fill="#171717" stroke="#fafafa" stroke-width="1.2"/>
    <path d="M 6.5 -4 L 9 -1.5 L 14 -6.5" fill="none" stroke="#fafafa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="0" font-size="14.5" font-weight="700" fill="#fafafa">60 / 120 FPS Frame-Budget Targeting</text>
    <text x="32" y="18" font-size="11.5" fill="#a3a3a3">Every screen benchmarked on physical mid-range hardware</text>
  </g>

  <!-- Item 2 -->
  <g transform="translate(518 132)" font-family="'Inter',sans-serif">
    <circle cx="10" cy="-4" r="8" fill="#171717" stroke="#fafafa" stroke-width="1.2"/>
    <path d="M 6.5 -4 L 9 -1.5 L 14 -6.5" fill="none" stroke="#fafafa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="0" font-size="14.5" font-weight="700" fill="#fafafa">Impeller GPU Engine &amp; Pre-warmed Shaders</text>
    <text x="32" y="18" font-size="11.5" fill="#a3a3a3">Zero shader compilation jank on critical user scroll paths</text>
  </g>

  <!-- Item 3 -->
  <g transform="translate(518 178)" font-family="'Inter',sans-serif">
    <circle cx="10" cy="-4" r="8" fill="#171717" stroke="#fafafa" stroke-width="1.2"/>
    <path d="M 6.5 -4 L 9 -1.5 L 14 -6.5" fill="none" stroke="#fafafa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="0" font-size="14.5" font-weight="700" fill="#fafafa">Granular Widget Rebuild Boundaries</text>
    <text x="32" y="18" font-size="11.5" fill="#a3a3a3">RepaintBoundary isolation; no unnecessary whole-tree redraws</text>
  </g>

  <!-- Item 4 -->
  <g transform="translate(518 224)" font-family="'Inter',sans-serif">
    <circle cx="10" cy="-4" r="8" fill="#171717" stroke="#fafafa" stroke-width="1.2"/>
    <path d="M 6.5 -4 L 9 -1.5 L 14 -6.5" fill="none" stroke="#fafafa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="0" font-size="14.5" font-weight="700" fill="#fafafa">Asynchronous Dart Isolates &amp; Precached Textures</text>
    <text x="32" y="18" font-size="11.5" fill="#a3a3a3">Offloads JSON parsing, audio decodes &amp; heavy math off main UI thread</text>
  </g>
</svg>
